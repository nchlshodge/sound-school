<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound School · RCC</title>
<meta name="theme-color" content="#3F3399">
<meta name="apple-mobile-web-app-title" content="Sound School">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#1E2235; --ink2:#4A5068; --line:#E1E4EE; --chip:#ECEEF5;
  --brand:#3F3399; --ok:#1F7A3A; --okbg:#E3F5E8; --bad:#B4421F; --badbg:#FBE7DF;
  --shadow:0 1px 0 rgba(30,34,53,.06),0 8px 24px rgba(30,34,53,.07);
  --u:var(--brand);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12131A; --card:#1C1E29; --ink:#ECEEF6; --ink2:#A7ACC2; --line:#2E3142; --chip:#262938;
    --ok:#7BD99A; --okbg:#16331F; --bad:#FFA486; --badbg:#3A1E15;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#12131A; --card:#1C1E29; --ink:#ECEEF6; --ink2:#A7ACC2; --line:#2E3142; --chip:#262938;
  --ok:#7BD99A; --okbg:#16331F; --bad:#FFA486; --badbg:#3A1E15;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,.disp{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--u);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 120px}
.ut{color:var(--u)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ut{color:color-mix(in srgb,var(--u) 45%,#fff)}}
:root[data-theme="dark"] .ut{color:color-mix(in srgb,var(--u) 45%,#fff)}
.tint{background:color-mix(in srgb,var(--u) 13%,var(--card))}
.m svg,.m img{width:100%;height:100%;display:block}
.m img{object-fit:contain}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:60px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .m{width:38px;height:38px}
.brand h1{font-size:22px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:999px;padding:6px 11px;font-weight:800;font-size:15px}
.chip svg{width:18px;height:18px}
.chip.fire{color:#C2561A}
.chip.xp{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.fire{color:#FF9D5C}:root:not([data-theme="light"]) .chip.xp{color:#B3A9FF}}
:root[data-theme="dark"] .chip.fire{color:#FF9D5C}:root[data-theme="dark"] .chip.xp{color:#B3A9FF}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--chip)}
.iconbtn svg{width:24px;height:24px}

/* hero */
.hero{display:flex;gap:14px;align-items:flex-end;margin:22px 0 8px}
.hero .m{width:96px;height:96px;flex:none}
/* home: the whole team, with the message pointing up at them */
.eqg-svg{display:block;width:100%;height:auto;margin:10px 0 6px;background:color-mix(in srgb,var(--u) 7%,var(--card));border-radius:12px}
.eqg-line{fill:none;stroke:var(--u);stroke-width:2.5}
.eqg-zero{stroke:var(--line);stroke-width:1.5}
.eqg-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.eqg-lbl{fill:var(--ink2);font-size:10px}
.eqg-moves{margin:6px 0 0;padding-left:20px}
.eqg-moves li{margin:4px 0}
.secrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;align-items:center;-webkit-overflow-scrolling:touch}
.secrow span{font-weight:800;font-size:13px;color:var(--ink2);flex:none}
.chipbtn{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chipbtn.on{background:var(--u,#3F3399);border-color:var(--u,#3F3399);color:#fff}
.cbank{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.cstrip{flex:none;width:78px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start}
.cstrip.sel{border-color:var(--u,#3F3399);box-shadow:0 0 0 3px color-mix(in srgb,var(--u,#3F3399) 25%,transparent)}
.cstrip.dim{opacity:.5}
.cstrip.fxs,.cstrip.mst{background:color-mix(in srgb,var(--u,#3F3399) 9%,var(--card))}
.cname{font:inherit;font-size:12px;font-weight:800;border:0;background:none;color:var(--ink);text-align:center;min-height:32px;width:100%;line-height:1.15;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.cins{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:30px;align-content:flex-start}
.cins i,.cins button{font:inherit;font-style:normal;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;border:0;background:var(--line);color:var(--ink2);cursor:pointer;line-height:1.3}
.cins .on{background:#1F7A3A;color:#fff}
.cpan{width:64px;margin:0}
.cbtns{display:flex;gap:4px}
.cbtns button{width:30px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:12px;color:var(--ink);cursor:pointer;padding:0}
.cbtns .cm.on{background:#B4421F;border-color:#B4421F;color:#fff}
.cbtns .cs.on{background:#C99A06;border-color:#C99A06;color:#fff}
.cfad{position:relative;height:180px;width:64px}
.cfad input[type=range]{position:absolute;width:176px;max-width:none;left:-60px;top:82px;transform:rotate(-90deg);margin:0}
.cmeter{position:absolute;right:0;top:2px;bottom:2px;width:7px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;align-items:flex-end}
.cmeter i{display:block;width:100%;height:0;background:linear-gradient(to top,#1F7A3A 0,#1F7A3A 70%,#C99A06 88%,#B4421F 100%);background-size:100% 172px;background-position:bottom}
.cdb{font-size:11px;white-space:nowrap}
.cgr{font-size:10px;color:#B4421F;min-height:12px;font-weight:800}
.plug{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.plug:first-child{border-top:0;margin-top:0;padding-top:0}
.plug h4{margin:0 0 2px;font-family:'Fredoka',sans-serif;font-size:18px}
.m32eq{background:#17181B;color:#E8EAED;border-radius:16px;padding:12px;margin:0 -4px}
.m32top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.m32top span{flex:1;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:#C9CDD3}
.m32btn{font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;border:1px solid #3A3D43;background:#26282C;color:#9AA0A8;border-radius:6px;padding:7px 12px;cursor:pointer}
.m32btn.on{background:#2B2F12;color:#FFE14D;border-color:#FFE14D;box-shadow:0 0 10px rgba(255,225,77,.35)}
.m32screen{background:#0B0C0E;border:1px solid #2C2F34;border-radius:10px;touch-action:none}
.m32svg{display:block;width:100%;height:auto}
.m32svg .mg{stroke:#24272C;stroke-width:1}
.m32svg .mz{stroke:#4A4E55;stroke-width:1.2}
.m32svg .ml{fill:#7D838C;font-size:11px;font-family:Nunito,sans-serif}
.m32svg .mcurve{fill:none;stroke:#FFE14D;stroke-width:2.6}
.m32svg .mfill{fill:rgba(255,225,77,.13)}
.m32svg .off{opacity:.3}
.m32svg .mnode{cursor:grab}
.m32svg .mnode circle{stroke:#0B0C0E;stroke-width:2}
.m32svg .mnode circle.mhit{fill:transparent;stroke:none}
.m32svg .mnode text{fill:#0B0C0E;font-size:12px;font-weight:800;font-family:Nunito,sans-serif;pointer-events:none}
.m32hint{color:#7D838C;font-size:12px;margin:6px 2px 10px;text-align:center}
.m32bands{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mband{background:#202226;border:1px solid #2E3136;border-top:3px solid var(--b);border-radius:10px;padding:6px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mbh{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--b);white-space:nowrap}
.mtype{font-size:10px;color:#7D838C;font-weight:700}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none;outline:none}
.knob.ghost{height:66px}
.knob.dis{opacity:.35;cursor:default}
.knob:focus-visible .kdial{box-shadow:0 0 0 3px #FFE14D}
.kdial{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7A7F87,#3A3D43 60%,#26282C);border:2px solid #111;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.kdial i{position:absolute;left:50%;top:3px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:var(--b,#FFE14D);transform-origin:50% 16px}
.kval{font-size:11px;color:#E8EAED;font-variant-numeric:tabular-nums}
.knob span{font-size:9px;font-weight:800;letter-spacing:.06em;color:#8B9199}
@media (max-width:420px){ .kdial{width:32px;height:32px} .kdial i{height:12px;transform-origin:50% 13px} .m32bands{gap:4px} .mbh{font-size:9px} }
.mpanel{margin:0 -4px 10px}
.mtag{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;color:#FFE14D;border:1px solid #4A4E55;border-radius:4px;padding:2px 6px}
.dynrow{display:flex;gap:8px;align-items:stretch;margin-bottom:10px;min-height:150px}
.dyngraph{flex:1;background:#0B0C0E;border:1px solid #2C2F34;border-radius:10px;min-width:0}
.dynsvg{max-height:220px}
.m32svg .mthr{stroke:#FF5A4E;stroke-width:1.5;stroke-dasharray:3 3}
.m32svg .mdot{fill:#fff;stroke:#FFE14D;stroke-width:2}
.grm{width:14px;background:#0B0C0E;border:1px solid #2C2F34;border-radius:6px;position:relative;overflow:hidden;min-height:60px}
.grm i{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(#FF8A3D,#FF5A4E)}
.grtxt{align-self:center;color:#FFB35A;font-weight:800;font-size:13px;min-width:56px;font-variant-numeric:tabular-nums}
.led{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 7px;border-radius:5px;background:#16361F;color:#3DDC84;border:1px solid #3DDC84}
.led.shut{background:#3A1614;color:#FF5A4E;border-color:#FF5A4E}
.led.dim{background:#26282C;color:#7D838C;border-color:#3A3D43}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px 4px;background:#202226;border:1px solid #2E3136;border-radius:10px;padding:8px 4px;--b:#FFE14D}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.m32surface{background:linear-gradient(#26282C,#1B1C1F);border:1px solid #33363B;border-radius:16px;padding:10px 8px 12px;color:#E8EAED;margin:0 -6px}
.layers{display:flex;gap:6px;margin-bottom:8px}
.mb{font:inherit;font-size:10px;font-weight:800;letter-spacing:.06em;border:1px solid #3A3D43;background:#2C2E33;color:#9AA0A8;border-radius:5px;padding:6px 8px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.mb.on{color:#111}
.mb.layer.on,.mb.page.on{background:#FFE14D;border-color:#FFE14D}
.mb.selb.on{background:#3FE0F0;border-color:#3FE0F0}
.mb.solo.on{background:#FFD23F;border-color:#FFD23F}
.mb.mmute.on{background:#FF4136;border-color:#FF4136;color:#fff}
.mbank{display:flex;gap:6px;align-items:stretch}
.mbank .cbank{flex:1;padding:0 0 6px;gap:5px}
.mstrip{flex:none;width:74px;background:linear-gradient(#34373C,#2A2C30);border:1px solid #3E4147;border-radius:10px;padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start}
.mstrip.sel{border-color:#3FE0F0;box-shadow:0 0 0 2px rgba(63,224,240,.35)}
.mstrip.dim .mfad{opacity:.55}
.mstrip.main{border-color:#55585E;background:linear-gradient(#3A3D42,#2E3034)}
.scrib{font:inherit;width:100%;border:0;border-radius:5px;background:var(--sc);color:#111;padding:3px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.1;cursor:pointer;min-height:38px;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.scrib span{font-size:9px;font-weight:800;opacity:.75}
.scrib b{font-size:11px;font-weight:800;text-align:center;word-break:break-word}
.scrib.small{width:auto;min-width:96px;padding:3px 10px;min-height:0;cursor:default}
.mstrip .mb.selb{width:100%;padding:4px 0}
.mstrip .cins{min-height:0;gap:2px}
.mstrip .cins button{font-size:8px;padding:2px 4px;background:#1E2023;color:#7D838C}
.mstrip .cins .on{background:#1F7A3A;color:#fff}
.mrow{display:flex;gap:4px;width:100%;align-items:stretch}
.mbs{display:flex;flex-direction:column;gap:4px;flex:1}
.mbs .mb{padding:5px 0;font-size:9px}
.mtiny{font-size:8px;font-weight:800;color:#7D838C;border:1px solid #3A3D43;border-radius:4px;text-align:center;padding:3px 0}
.mtiny.on{color:#111;background:#3DDC84;border-color:#3DDC84}
.leds{display:flex;flex-direction:column-reverse;gap:2px;width:9px;padding:2px;background:#111;border-radius:3px}
.leds i{display:block;height:5px;border-radius:1px;background:#1D2A20}
.leds i.y{background:#2E2A12}.leds i.r{background:#341614}
.leds i.g.lit{background:#3DDC84;box-shadow:0 0 4px #3DDC84}.leds i.y.lit{background:#FFD23F;box-shadow:0 0 4px #FFD23F}.leds i.r.lit{background:#FF4136;box-shadow:0 0 4px #FF4136}
.mfad{position:relative;height:190px;width:64px}
.mscale{position:absolute;left:0;top:7px;bottom:7px;width:24px}
.mscale span{position:absolute;right:0;transform:translateY(-50%);font-size:8px;font-weight:700;color:#8B9199;font-variant-numeric:tabular-nums}
.mfad input[type=range]{position:absolute;width:176px;max-width:none;left:-46px;top:87px;transform:rotate(-90deg);margin:0;-webkit-appearance:none;appearance:none;background:transparent;height:30px}
.mfad input[type=range]::-webkit-slider-runnable-track{height:6px;background:#0E0F11;border-radius:3px;border:1px solid #000}
.mfad input[type=range]::-moz-range-track{height:6px;background:#0E0F11;border-radius:3px}
.mfad input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:30px;margin-top:-13px;border-radius:3px;background:linear-gradient(90deg,#9EA3AA,#DADDE1 45%,#5A5E64 50%,#DADDE1 55%,#9EA3AA);border:1px solid #111;box-shadow:0 2px 3px rgba(0,0,0,.6)}
.mfad input[type=range]::-moz-range-thumb{width:16px;height:30px;border-radius:3px;background:linear-gradient(90deg,#9EA3AA,#DADDE1 45%,#5A5E64 50%,#DADDE1 55%,#9EA3AA);border:1px solid #111}
.mdb{font-size:11px;color:#E8EAED;font-variant-numeric:tabular-nums;white-space:nowrap}
.mscreenbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#17181B;border-radius:12px;padding:8px;margin:0 -4px 10px}
.mscreenbar .scrib{background:var(--sc)}
.pages{display:flex;gap:4px;flex-wrap:wrap}
.kbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.kbtn span{font-size:9px;font-weight:800;letter-spacing:.06em;color:#8B9199}
.pre{flex:1;height:16px;background:#0B0C0E;border:1px solid #2C2F34;border-radius:6px;position:relative;overflow:hidden}
.prez{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.18);border-left:1px solid #3DDC84;border-right:1px solid #3DDC84}
.pre i{position:absolute;left:0;top:3px;bottom:3px;width:0;background:#8B9199;border-radius:3px}
.pre i.ok{background:#3DDC84}.pre i.hot{background:#FF4136}
.ch.locked{opacity:.45}
.buildcard .steps{display:flex;gap:6px;flex-wrap:wrap}
.stp{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;border:2px solid var(--line);color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
.stp svg{width:12px;height:12px}
.stp.now{border-color:var(--u,#3F3399);color:var(--u,#3F3399)}
.stp.done{background:#1F7A3A;border-color:#1F7A3A;color:#fff}
.glegend{display:flex;gap:12px;justify-content:center;font-size:11px;color:#8B9199;padding:4px 0 6px}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ctarget{position:relative;height:16px;background:#0B0C0E;border:1px solid #2C2F34;border-radius:8px;margin-top:6px}
.ctz{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.25);border-left:1px solid #3DDC84;border-right:1px solid #3DDC84}
.ctarget i{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#FFE14D;border-radius:2px;box-shadow:0 0 6px #FFE14D}
#cplot .mdot{display:none}
.ctscale{display:flex;justify-content:space-between;font-size:10px;color:#7D838C;margin-top:2px}
.dlytime{display:flex;align-items:center;gap:8px;background:#0B0C0E;border:1px solid #2C2F34;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.dlytime>div{flex:1;display:flex;flex-direction:column}
.dlytime b{font-size:24px;color:#FFE14D;font-variant-numeric:tabular-nums;font-family:'Fredoka',sans-serif}
.dlytime span{font-size:11px;color:#8B9199}
.m32btn.tap{min-width:64px;min-height:44px;font-size:14px}
.facrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.facrow span{font-size:10px;font-weight:800;letter-spacing:.06em;color:#8B9199;width:42px}
.facrow .m32btn{padding:5px 7px;font-size:11px}
#con-dly{scroll-margin-top:12px}
.teampic{display:block;width:100%;height:auto;aspect-ratio:1100/553;margin:14px 0 4px}
.hero.up{display:block;margin-top:6px}
.hero.up .bubble::after{left:50%;top:-9px;bottom:auto;margin-left:-7px;border-left:2px solid var(--line);border-top:2px solid var(--line);border-bottom:0}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);flex:1}
.bubble::after{content:"";position:absolute;left:-9px;bottom:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .bt{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;display:block;margin-bottom:2px}
.bubble p{margin:0;color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{--d:color-mix(in srgb,var(--u) 70%,#000);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;background:var(--u);color:#fff;font-weight:800;font-size:17px;letter-spacing:.02em;box-shadow:0 4px 0 var(--d);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{background:var(--chip);color:var(--ink2);box-shadow:0 4px 0 var(--line)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}

/* unit cards */
.unit{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-top:18px;position:relative}
.unit.locked{opacity:.62}
.uhead{display:flex;gap:14px;align-items:center}
.uhead .m{width:76px;height:76px;flex:none;border-radius:18px;padding:6px}
.uhead h2{font-size:24px}
.uhead .who{font-weight:800;font-size:14px}
.uhead p{margin:2px 0 0;color:var(--ink2);font-size:15px;line-height:1.35}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink2);padding:4px 0;border-radius:14px}
.node .dot{--d:color-mix(in srgb,var(--u) 70%,#000);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;border:3px solid var(--u);color:var(--u);background:var(--card);box-shadow:0 4px 0 color-mix(in srgb,var(--u) 35%,var(--line));transition:transform .1s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .node:not(.done) .dot{color:color-mix(in srgb,var(--u) 45%,#fff);border-color:color-mix(in srgb,var(--u) 60%,#fff)}}
:root[data-theme="dark"] .node:not(.done) .dot{color:color-mix(in srgb,var(--u) 45%,#fff);border-color:color-mix(in srgb,var(--u) 60%,#fff)}
.node .dot svg{width:26px;height:26px}
.node.done .dot{background:var(--u);color:#fff;border-color:var(--u);box-shadow:0 4px 0 var(--d)}
.node.next .dot{animation:pulse 2s infinite}
.node.lock .dot{border-color:var(--line)!important;color:var(--ink2)!important;box-shadow:0 4px 0 var(--line);background:var(--chip)}
.node:not(:disabled):hover .dot{transform:translateY(-2px)}
@keyframes pulse{0%,100%{outline:0 solid color-mix(in srgb,var(--u) 30%,transparent)}50%{outline:7px solid color-mix(in srgb,var(--u) 18%,transparent)}}

/* lesson */
.lbar{max-width:600px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.prog{flex:1;height:16px;background:var(--chip);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--u);border-radius:999px;transition:width .35s}
.say{display:flex;gap:12px;align-items:flex-end;margin:10px 0 18px}
.readbtn{position:absolute;right:4px;bottom:4px;width:36px;height:36px;color:var(--u,var(--ink2))}.readbtn svg{width:22px;height:22px}
.say .bubble:has(.readbtn){padding-right:44px}
.say .m{width:84px;height:84px;flex:none}
.say .bubble .bt{font-size:20px}
.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.clips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
.clip{width:140px;min-height:120px;border-radius:20px;background:var(--card);border:3px solid var(--u);box-shadow:0 5px 0 color-mix(in srgb,var(--u) 40%,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;transition:transform .06s}
.clip:active{transform:translateY(3px)}
.clip .ic{width:48px;height:48px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center}
.clip .ic svg{width:24px;height:24px}
.clip .lb{font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px}
.clip .rv{font-size:13px;font-weight:800;color:var(--ink2);min-height:18px;text-align:center;line-height:1.2}
.clip.small{width:auto;min-height:56px;flex-direction:row;padding:6px 16px 6px 8px;border-width:2px;border-radius:16px}
.clip.small .ic{width:38px;height:38px}
.clip.small .ic svg{width:18px;height:18px}
.clip.small .lb{font-size:16px;font-family:'Nunito',sans-serif;font-weight:800}
.clip.on .ic{background:var(--ink);color:var(--card)}
.bars{display:none;gap:3px;align-items:flex-end;height:20px}
.clip.on .bars{display:flex}.clip.on .pl{display:none}
.pl{display:grid}
.bars i{width:4px;background:currentColor;border-radius:2px;animation:eq .8s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:58px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:12px 16px;text-align:left;font-weight:700;font-size:17px;display:flex;align-items:center;gap:12px}
.opts.two .opt{justify-content:center;text-align:center;font-family:'Fredoka',sans-serif;font-size:21px;font-weight:600}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.opt small{display:block;font-weight:600;color:var(--ink2);font-size:14px}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--u) 50%,var(--line))}
.opt.right{border-color:var(--ok);background:var(--okbg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);box-shadow:0 4px 0 var(--bad)}
.opt:disabled:not(.right):not(.wrong){opacity:.6}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:2px solid var(--line);background:var(--card);animation:up .25s ease-out;max-height:70vh;overflow:auto}
.sheet .in{max-width:600px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.ok{background:var(--okbg);border-color:var(--ok)}
.sheet.bad{background:var(--badbg);border-color:var(--bad)}
.sheet h3{font-size:22px;display:flex;align-items:center;gap:8px}
.sheet.ok h3{color:var(--ok)}.sheet.bad h3{color:var(--bad)}
.sheet h3 svg{width:26px;height:26px}
.sheet p{margin:6px 0 12px;color:var(--ink)}
.sheet .tip{margin-top:-4px;font-size:14px;color:var(--ink2)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* learn */
.slide{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-top:6px}
.slide h2{font-size:26px;margin-bottom:8px}
.slide p{margin:0 0 10px;color:var(--ink2)}
.slide .demos{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--u);width:22px;border-radius:4px}

/* result, setup, settings */
.center{text-align:center}
.big > .m{width:170px;height:170px;margin:26px auto 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 6px}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600}
.stat span{font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:6px 16px;margin-top:10px}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .t{flex:1}.set .t b{display:block}.set .t span{font-size:14px;color:var(--ink2)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{left:24px}
input[type=range]{width:100%;accent-color:var(--brand)}
.sec-title{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:26px 4px 0}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.team > div{text-align:center}
.team .m{width:84px;height:84px;margin:0 auto;border-radius:18px;padding:6px}
.loading{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;text-align:center}
.loading .m{width:120px;height:120px;margin:0 auto 10px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px)}}
.foot{color:var(--ink2);font-size:14px;text-align:center;margin-top:28px}

.gmeter{position:relative;height:20px;background:var(--chip);border-radius:10px;overflow:hidden}
.gmeter i{position:absolute;left:0;top:0;bottom:0;width:0;background:#7C8598;border-radius:10px}
.gmeter i.good{background:#2FA36B}.gmeter i.hot{background:#E0A100}.gmeter i.clip{background:#D9432B}
.gzone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,#2FA36B 22%,transparent);border-left:2px solid #2FA36B;border-right:2px solid #2FA36B}
.runbox{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.runbar{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.runbar i{display:block;height:100%;width:0;background:var(--u);transition:width .5s linear}
#run-cue{font-size:18px;margin:8px 0 0}
.scrow{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.scrow:last-child{border-bottom:0}.scn b{display:block;font-size:15px}.scn span{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.scg{grid-column:1/-1;display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center}.scg b{text-align:right;font-variant-numeric:tabular-nums}
.gmeter.sm{height:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.exgrid{grid-template-columns:1fr}}
.excard{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:stretch}
.exmain{flex:1;display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;min-height:88px}
.exmain:hover{background:color-mix(in srgb,var(--u) 6%,var(--card))}
.excard .m{width:56px;height:56px;flex:none;border-radius:14px;padding:4px}
.ext b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;line-height:1.2}
.ext span{display:block;font-size:14px;color:var(--ink2);line-height:1.3;margin-top:2px}
.ext em{display:block;font-style:normal;font-size:12px;font-weight:800;margin-top:4px;color:var(--u)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ext em{color:color-mix(in srgb,var(--u) 45%,#fff)}}
:root[data-theme="dark"] .ext em{color:color-mix(in srgb,var(--u) 45%,#fff)}
.exshare{align-self:flex-start;margin:6px 6px 0 0}

/* mixer */
.board{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:4px 14px;margin-top:6px}
.ch{display:grid;grid-template-columns:112px 1fr 44px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch:last-child{border-bottom:0}
.ch .chn b{display:block;font-size:15px;line-height:1.2}
.ch .chn span{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.ch .fd{display:flex;flex-direction:column;gap:6px}
.ch input[type=range]{accent-color:var(--u);height:28px;margin:0}
.meter{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#2FA36B;border-radius:3px}
.meter i.hot{background:#E0A100}.meter i.clip{background:#D9432B}
.hpf{display:block;margin-top:5px;font:inherit;font-size:13px;font-weight:700;padding:3px 4px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2);max-width:104px}
.mute{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:15px;color:var(--ink2)}
.chbtns{display:flex;flex-direction:column;gap:6px}
.eqbtn{font-size:12px;height:32px}.eqbtn.on{border-color:var(--u);color:var(--u)}
.eqpanel{display:grid;gap:8px;padding:10px 4px 14px;border-bottom:1px solid var(--line)}
.eqrow{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;font-size:14px;font-weight:700;color:var(--ink2)}
.eqrow b{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.mute[aria-pressed="true"]{background:#B4421F;border-color:#B4421F;color:#fff}
.ch.off .chn,.ch.off .fd{opacity:.45}
.transport{position:sticky;bottom:0;z-index:4;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:14px}
.score{font-family:'Fredoka',sans-serif;font-size:56px;font-weight:600;line-height:1}
.notes{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.notes li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--chip);font-weight:700;font-size:15px}
.notes li span{color:var(--ink2);font-weight:700;text-align:right}
.notes li.good span{color:var(--ok)}.notes li.bad{background:var(--badbg)}.notes li.bad span{color:var(--bad)}
@media (max-width:420px){
  .node .dot{width:50px;height:50px;font-size:20px}
  .clip{width:calc(50% - 6px)}
  .uhead .m{width:64px;height:64px}
  .brand h1{font-size:19px}
  .chip{padding:5px 8px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script>
/* ============================================================
   Sound School: ear training for the RCC sound team.
   The drills and the final mix use real multitrack recordings,
   stored in ./stems/<song>/ (see SONGS below).
   ============================================================ */

// Every character's default look: the happy pose from their expression sheet.
const MASCOTS = Object.fromEntries(['sona','pip','fenn','kit','hugo','bram','echo','verb','penny'].map(k=>[k, `<img class="pose" src="img/m-${k}-happy.webp" width="256" height="256" alt="" decoding="async">`]));

/* ---------- icons ---------- */
const I = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  flame:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.6 2.5c.6 3.4 4.9 5.3 4.9 10.3a5.5 5.5 0 0 1-11 0c0-2.8 1.6-4.4 2.7-5.4.2 1.9 1.1 3 2.4 3.2-.6-3.3.3-5.6 1-8.1z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 2 5 13.5h6L10 22l9-12h-6.2z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  phones:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 3v18M12 3v18M18 3v18"/><rect x="3.5" y="13" width="5" height="3" rx="1" fill="currentColor"/><rect x="9.5" y="6" width="5" height="3" rx="1" fill="currentColor"/><rect x="15.5" y="15" width="5" height="3" rx="1" fill="currentColor"/></svg>'
};
// Each character has six expressions (img/m-<id>-<mood>.webp).
const POSES = ['sona','pip','fenn','kit','hugo','bram','echo','verb','penny'];
const MOODS = ['happy','celebrating','thinking','encouraging','surprised','sleeping'];
const hasPose = (id, mood) => !!mood && POSES.includes(id) && MOODS.includes(mood);
const mascotArt = (id, mood) => hasPose(id,mood) ? `<img class="pose" src="img/m-${id}-${mood}.webp" width="256" height="256" alt="" decoding="async">` : (MASCOTS[id]||'');
const mascot = (id, cls='', mood) => `<div class="m ${cls}" data-m="${id}" aria-hidden="true">${mascotArt(id, mood)}</div>`;
// All markup below is authored in this file. The only user-entered text (names and emails on the team page) goes through esc().
const frag = s => document.createRange().createContextualFragment(s);

/* ---------- saved progress (this device only) ---------- */
const STORE_KEY = 'rcc-sound-school-v1';
function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
const S = Object.assign({ xp:0, streak:0, lastDay:null, done:{}, unlockAll:false, setup:false, readAloud:true, vol:0.7, mixStyle:'modern', console:'m32' }, loadState());
// Read aloud became the default (Oct 17, 2026): turn it on once for people who had it off; after that, their choice sticks.
if(!S.readAloudV){ S.readAloud=true; S.readAloudV=1; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} pushProgress(); }

/* ---------- accounts (Firebase project: RCC Training) ----------

// Fitted to the same six songs for tonal balance AND stereo width (crowd mics, stereo keys and guitars, wetter vocals).
const BCAST = {
  lhc:{ crowd:-4, acc:-6.5, b3:6, bass:-4.5, chloe:-0.5, corbin:-3, gtr1:-1.5, gtr2:6, hat:-0.5, keys:5.5, taylor:-3, tracks:5.5 },
  isg:{ crowd:-7.5, acc:-10, b3:6, bass:-0.5, gtr1:-2.5, gtr2:6.5, hat:-1, keys:6.5, kick:-1.5, oh:4, tracks:1 }
};
function styleRef(song, k, style=curStyle()){
  if(FX.includes(k) && curDest()==='broadcast') return FX_REF.broadcast[k];
  if(FX.includes(k)) return FX_REF[style][k];
  if(k==='crowd' && curDest()==='broadcast') return (BCAST[song.id]||{}).crowd ?? -10;
  const r=song.ref[k];
  if(style!=='modern' || song.traps.includes(k)) return r;
  return r + ((MODERN[song.id]||{})[k]||0) + (curDest()==='broadcast' ? ((BCAST[song.id]||{})[k]||0) : 0);
}
const HPF_STEPS = [0,80,120,200,300,400];
const HPF_LOW = ['kick','bass','drums','synth'], HPF_CHORD = ['keys','piano','organ','b3','acc','eg','gtr1','gtr2','horns','hat','eg2','eg3','keys2','pad'];
function hpfRef(song,k){ return HPF_LOW.includes(k) ? 0 : HPF_CHORD.includes(k) ? 300 : isVocal(song,k) ? 200 : 0; }
// null = fine; otherwise a coaching note.
function hpfCheck(song,k,f){
  if(HPF_LOW.includes(k)) return f<=80 ? null : 'Kick and bass own the low end. Take this filter off.';
  if(HPF_CHORD.includes(k)) return f>=200 ? null : 'High-pass around 200–400 Hz to keep it out of the kick and bass.';
  if(isVocal(song,k)) return f>=120 ? null : 'High-pass vocals around 120–300 Hz (less for male voices).';
  return null;
}

/* ============================================================
   AUDIO ENGINE
   ============================================================ */
const db = x => Math.pow(10, x/20);
const A = { ctx:null, buf:{}, ready:null, loading:{}, nodes:[], irs:{} };
const BAND_TARGET = -21.4, VOCAL_TARGET = -27.3;   // every song's full band and solo vocal are level-matched to these (dB RMS)

function initAudio(){
  if(A.ready) return A.ready;
  if(!A.ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    A.ctx = LOW_MEM ? new AC({sampleRate:32000}) : new AC();   // a third less memory for every decoded track
    A.master = A.ctx.createGain(); A.master.gain.value = S.vol;
    // Safety net so nothing in a drill can get painfully loud.
    const safe = A.ctx.createDynamicsCompressor();
    safe.threshold.value=-1; safe.knee.value=0; safe.ratio.value=20; safe.attack.value=0.001; safe.release.value=0.1;
    A.master.connect(safe).connect(A.ctx.destination);
  }
  A.ready = (async()=>{
    const sr=A.ctx.sampleRate, n=Math.ceil(6.5*sr);
    A.buf.thump = normalize(await offline(0.6, renderThump), 1);
    A.buf.pink  = normalize(arrToBuffer(pinkArr(n)), 0.25);
    A.buf.floor = normalize(arrToBuffer(floorArr(n, sr)), 1);
    A.buf.noise = arrToBuffer(Float32Array.from({length:sr}, ()=>Math.random()*2-1));
    // Ground-loop hum with a buzzy edge, for the line check.
    A.buf.hum = normalize(arrToBuffer(Float32Array.from({length:n}, (_,i)=>{ const t=i/sr, w=2*Math.PI*60*t; return 0.5*Math.sin(w)+0.3*Math.sin(2*w)+0.25*Math.sin(3*w)+0.12*Math.sign(Math.sin(w))*Math.abs(Math.sin(5*w)); })), 1);
    // Speaking voices, both real and from the Feb 15 service (private like the song stems): the pastor's sermon mic (Lav 1) and the announcements mic (MC 2).
    A.speechDb = {};
    await Promise.all(VOICES.map(async v=>{
      const data=await fetchAudio(voicePath(v), true), b=await new Promise((ok,bad)=>A.ctx.decodeAudioData(data, ok, bad));
      A.buf['speech:'+v]=b;
      // loudness of the speaking parts only (skip the pauses), so every voice plays at the vocal-drill level
      const d=b.getChannelData(0), blk=Math.floor(0.05*b.sampleRate), e=[];
      for(let i=0;i+blk<=d.length;i+=blk){ let x=0; for(let j=i;j<i+blk;j++) x+=d[j]*d[j]; e.push(x/blk); }
      e.sort((a,c)=>a-c); const loud=e.slice(Math.floor(e.length*0.3)), ms=loud.reduce((a,c)=>a+c,0)/loud.length;
      A.speechDb[v] = VOCAL_TARGET + 3 - 10*Math.log10(ms+1e-12);
    }));
    await loadSong(SONGS[0], true);
    // The other small songs load one at a time after a pause, so they don't slow down the first one. Big ones load when opened.
    if(!LOW_MEM) setTimeout(async()=>{ for(const s of SONGS.slice(1).filter(s=>!s.lazy)) await loadSong(s).catch(e=>console.warn(e)); }, 4000);
  })().catch(e=>{ A.ready=null; throw e; });
  return A.ready;
}
/* ----- Saving audio on the device -----
   Each audio file is kept in the browser's offline cache after its first download, and each song's level
   measurements in local storage, so later visits start in seconds. Bump AUDIO_VER whenever the stem files change. */
const AUDIO_VER = 'a2';
async function fetchAudio(path, priv=true){
  let cache=null;
  try{ if(self.caches){ cache=await caches.open('ss-audio-'+AUDIO_VER); const hit=await cache.match(path); if(hit) return await hit.arrayBuffer(); } }catch(e){ cache=null; }
  const res=await fetch(priv ? await stemURL(path) : path); if(!res.ok) throw new Error(`Missing ${path}`);
  if(cache){ try{ await cache.put(path, res.clone()); }catch(e){} }
  return await res.arrayBuffer();
}
// Clear out audio saved by older versions of the app.
try{ if(self.caches) caches.keys().then(ks=>ks.filter(k=>k.startsWith('ss-audio-') && k!=='ss-audio-'+AUDIO_VER).forEach(k=>caches.delete(k))); }catch(e){}
const calKey = song => `ss-cal-${AUDIO_VER}-${song.id}`;
function setLoadMsg(t){ const el=document.getElementById('loadmsg'); if(el) el.textContent=t; }
// Decoded tracks take a lot of memory, so only a few songs stay loaded; the one used longest ago is let go.
const MAX_SONGS = LOW_MEM ? 1 : 3;
function freeSongs(keep){
  const loaded=SONGS.filter(s=>s!==keep && A.loading[s.id]).sort((a,b)=>(a.used||0)-(b.used||0));
  while(loaded.length >= MAX_SONGS){ const s=loaded.shift();
    for(const k of Object.keys(A.buf)) if(k.startsWith(s.id+':')) delete A.buf[k];
    s.ready=false; A.loading[s.id]=null;
    if(typeof EQG!=='undefined' && EQG.song===s.id) EQG.cal=null;   // the EQ guide is measured again next time
    if(typeof FIXG!=='undefined') FIXG=FIXG.filter(w=>w.song!==s.id); }
}
function loadSong(song, show){
  song.used=Date.now();
  if(A.loading[song.id]) return A.loading[song.id];
  freeSongs(song);
  return A.loading[song.id] = (async()=>{
    let n=0;
    await Promise.all([...song.ch, ...(song.xtra||[]).map(k=>({k}))].map(async c=>{
      const data = await fetchAudio(`stems/${song.id}/${c.k}.m4a`);
      A.buf[`${song.id}:${c.k}`] = await new Promise((ok,bad)=>A.ctx.decodeAudioData(data, ok, bad));
      if(show) setLoadMsg(`Loading "${song.title}"… ${++n} of ${song.ch.length}`);
    }));
    // Level measurements: once per device, then remembered.
    let saved=null; try{ saved=JSON.parse(localStorage.getItem(calKey(song))); }catch(e){}
    if(saved && saved.cal && saved.comp){ Object.assign(song, {trim:saved.trim, vtrim:saved.vtrim, comp:saved.comp, cal:saved.cal}); if(saved.mbTrim!=null) song.mbTrim=saved.mbTrim; }
    else {
      if(show) setLoadMsg('Tuning up…');
      await calibrate(song);
      try{ localStorage.setItem(calKey(song), JSON.stringify({trim:song.trim, vtrim:song.vtrim, comp:song.comp, cal:song.cal, mbTrim:song.mbTrim})); }catch(e){}
    }
    song.ready=true;
  })().catch(e=>{ A.loading[song.id]=null; throw e; });
}
const readySongs = () => LISTED().filter(s=>s.ready);

function offline(dur, build){
  const sr=A.ctx.sampleRate, c=new OfflineAudioContext(1, Math.ceil(dur*sr), sr);
  build(c);
  return c.startRendering();
}
function normalize(buf, peak){
  const d=buf.getChannelData(0); let m=0;
  for(let i=0;i<d.length;i++){ const a=Math.abs(d[i]); if(a>m) m=a; }
  if(m>0){ const k=peak/m; for(let i=0;i<d.length;i++) d[i]*=k; }
  return buf;
}
function arrToBuffer(arr){ const b=A.ctx.createBuffer(1, arr.length, A.ctx.sampleRate); b.getChannelData(0).set(arr); return b; }
function renderThump(c){   // a dropped microphone
  const env=(g,peak,rel)=>{ g.gain.setValueAtTime(0.0001,0); g.gain.exponentialRampToValueAtTime(peak,0.002); g.gain.exponentialRampToValueAtTime(0.0001,0.002+rel); };
  const o=c.createOscillator(); o.frequency.setValueAtTime(95,0); o.frequency.exponentialRampToValueAtTime(40,0.25);
  const g=c.createGain(); env(g,1,0.5); o.connect(g).connect(c.destination); o.start(0);
  const nb=c.createBuffer(1, Math.ceil(0.3*c.sampleRate), c.sampleRate), d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const n=c.createBufferSource(); n.buffer=nb;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500;
  const g2=c.createGain(); env(g2,0.9,0.12); n.connect(lp).connect(g2).connect(c.destination); n.start(0);
}
function pinkArr(n){
  const a=new Float32Array(n); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1;
    b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856;
    b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; a[i]=b0+b1+b2+b3+b4+b5+b6+w*.5362; b6=w*.115926; }
  return a;
}
// Hiss + 60 Hz hum: the kind of noise floor a gate is meant to clean up.
function floorArr(n, sr){
  const a=new Float32Array(n);
  for(let i=0;i<n;i++){ const t=i/sr;
    a[i]=(Math.random()*2-1)*0.55 + Math.sin(2*Math.PI*60*t)*0.5 + Math.sin(2*Math.PI*120*t)*0.25 + Math.sin(2*Math.PI*180*t)*0.12; }
  return a;
}

/* ----- playback -----
   spec = { src:[{ b: buffer key | AudioBuffer, db, off: seconds into the file, dur, at: start delay }],
            chain:(ctx,input)=>output, gain, tail } */
const bufOf = s => typeof s.b==='string' ? A.buf[s.b] : s.b;
const specLen = spec => spec.len ?? Math.max(...spec.src.map(s=>s.loop ? 120 : (s.at||0)+(s.dur||bufOf(s).duration)));
function graph(c, spec, dest, t0){
  const bus=c.createGain(), srcs=[];
  for(const s of (spec.src||[])){
    const n=c.createBufferSource(); n.buffer=bufOf(s);
    const g=c.createGain(); g.gain.value=db(s.db||0)*(s.flip?-1:1);   // flip = the polarity (Ø) button
    if(s.hpf){ const h=c.createBiquadFilter(); h.type='highpass'; h.frequency.value=s.hpf; h.Q.value=0.707; n.connect(h).connect(g); }
    else n.connect(g);
    g.connect(bus);
    if(s.loop){ n.loop=true; n.loopStart=s.off||0; n.loopEnd=(s.off||0)+s.dur; n.start(t0, s.off||0); }
    else if(s.dur) n.start(t0+(s.at||0), s.off||0, s.dur); else n.start(t0+(s.at||0), s.off||0);
    srcs.push(n);
  }
  if(spec.synth) spec.synth(c, bus, t0);   // synthesized examples (the Keys & Auto-Tune unit)
  const fx = spec.chain ? spec.chain(c,bus) : bus;
  const out=c.createGain(); out.gain.value=db(spec.gain||0);
  fx.connect(out).connect(dest);
  return {src:srcs, out};
}
function stopAll(){
  if(!A.ctx) return;
  const now=A.ctx.currentTime;
  for(const n of A.nodes){
    n.src.forEach(s=>{ try{ s.stop(); }catch(e){} });
    try{ n.out.gain.setTargetAtTime(0, now, 0.01); const o=n.out; setTimeout(()=>o.disconnect(), 150); }catch(e){}
  }
  A.nodes=[];
}
function play(spec){
  const c=A.ctx; if(c.state!=='running') c.resume(); hush();
  stopAll(); stopMixer();
  A.nodes.push(graph(c, spec, A.master, c.currentTime+0.04));
  return specLen(spec) + (spec.tail||0.3);
}
async function measure(spec){
  const sr=A.ctx.sampleRate, c=new OfflineAudioContext(2, Math.ceil(specLen(spec)*sr), sr);
  graph(c, spec, c.destination, 0);
  const r=await c.startRendering(); let s=0, pk=0, n=0;
  for(let ch=0;ch<2;ch++){ const d=r.getChannelData(ch); for(let i=0;i<d.length;i++){ const x=d[i]; s+=x*x; if(Math.abs(x)>pk) pk=Math.abs(x); } n+=d.length; }
  return { rms:10*Math.log10(s/n+1e-12), peak:20*Math.log10(pk+1e-9) };
}

/* ----- per-song calibration -----
   Level-match every A/B pair so the answer is never just "the louder one". (The browser's
   compressor also adds its own automatic makeup gain; this cancels it out.) */
async function calibrate(song){
  const wb=at(song,song.win.full[0]), wv=at(song,song.win.verse[0]);
  song.trim=0; song.trim = BAND_TARGET - (await measure({src:BAND(song,{},wb)})).rms;
  song.vtrim=0; song.vtrim = VOCAL_TARGET - (await measure({src:VOCAL(song,wv)})).rms;
  const band=await measure({src:BAND(song,{},wb)}), voc=await measure({src:VOCAL(song,wv)});
  const comp = song.comp = {
    vocalHeavy:{ratio:8, thr:voc.rms-6}, vocalGentle:{ratio:3, thr:voc.rms+4}, bandGentle:{ratio:3, thr:band.rms+3},
    bandSquash:{ratio:20, knee:0, attack:0.002, release:0.35, thr:band.rms-22},
    limit:{ratio:20, knee:0, attack:0.001, release:0.06, thr:Math.round(band.peak-9+1)} };
  song.cal = { clip:{}, phone:0, pink:0, hpf:0, luke:0 };
  const match = async (spec, target) => target - (await measure(spec)).rms;
  const jobs = [['vocalHeavy',VOCAL(song,wv),voc.rms+1],['vocalGentle',VOCAL(song,wv),voc.rms],['bandGentle',BAND(song,{},wb),band.rms],
                ['bandSquash',BAND(song,{},wb),band.rms],['limit',BAND(song,{},wb,-9),band.rms-9]];
  for(const [k,src,target] of jobs){ comp[k].makeup=0; comp[k].makeup=await match({src,chain:fxComp(comp[k])}, target); }
  for(const d of [7,2.6]){ song.cal.clip[d]=1; song.cal.clip[d]=db(await match({src:BAND(song,{},wb),chain:fxClip(song,d)}, band.rms)); }
  song.cal.phone=await match({src:BAND(song,{},wb),chain:fxPhone(song)}, band.rms);
  song.cal.pink=await match({src:PINK(song)}, band.rms-3);
  song.cal.hpf=await match({src:BAND(song,{},wb,0,true)}, band.rms);
  song.cal.luke=await match({src:VOCAL(song,wv),chain:fxLukeEq(song)}, voc.rms);
  song.cal.lowcut=await match({src:BAND(song,{},wb),chain:fxLowCut()}, band.rms);
  if(song.xtra && song.xtra.includes('mb1')) await calOurs(song);
}

/* ----- EQ starting points -----

   tables repeat another instrument's text (acoustic = bass, snare = kick); we follow the guide's EQ pictures there.
   Each `eq` list is the guide's picture for that instrument; `ch` is the channel we play it on in "Let's Have Church". */
const EQ_START = [

const EQG = { song:'lhc', cal:null };
// The guide's acoustic table by mistake (it repeats the bass row): used in a Hard question to show why we follow the picture.
const ACOUSTIC_AS_BASS = [{type:'highpass',f:40,q:0.7},{type:'peaking',f:60,g:7,q:1.2},{type:'peaking',f:650,g:6,q:1.2},{type:'lowpass',f:5000,q:0.7}];
const eqgCh = it => it.vocal ? songById(EQG.song).vocal : it.ch;
const eqStartChain = eq => (c,inp)=>eq.reduce((n,e)=>n.connect(eqNode(c,e)), inp);
// One instrument, soloed, from its loudest 6 seconds; level-matched flat vs. starting point.
function eqgSpec(it, on){
  const song=songById(EQG.song), cal=EQG.cal&&EQG.cal[it.id]||{off:0,trim:0,match:0};

async function prepEqGuide(){

    if(!it.bar){ const sr=buf.sampleRate, d=buf.getChannelData(0), sec=[]; for(let i=0;i+sr<=d.length;i+=sr){ let e=0; for(let j=i;j<i+sr;j++) e+=d[j]*d[j]; sec.push(e); }

// The EQ curve, drawn from the same filters the audio uses.

}

// Short noise events (pops, rustle, breaths) placed inside a clip.
function burst(c, dest, t, {type='noise', f=1000, q=0.7, len=0.12, level=-20, shape='decay'}){
  const t0=c.currentTime+0.04+t, g=c.createGain(); g.gain.value=0; g.connect(dest);
  let src;
  if(type==='pop'){ src=c.createOscillator(); src.frequency.setValueAtTime(90,t0); src.frequency.exponentialRampToValueAtTime(35,t0+len); }
  else { src=c.createBufferSource(); src.buffer=A.buf.noise; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q; src.connect(bp); bp.connect(g); }
  if(type==='pop') src.connect(g);
  const L=db(level);
  if(shape==='swell'){ g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(L,t0+len*0.5); g.gain.linearRampToValueAtTime(0,t0+len); }
  else if(shape==='crackle'){ for(let i=0;i<8;i++){ const ti=t0+i*len/8; g.gain.setValueAtTime(L*(0.3+Math.random()*0.7),ti); g.gain.setValueAtTime(0,ti+len/16); } }
  else { g.gain.setValueAtTime(L,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+len); }
  src.start(t0); src.stop(t0+len+0.05);
}

// Feedback: the mic hears the speakers and rings at one frequency. `state` lets the ring-out game move a notch live.
// Unity gain for small signals; a runaway ring flattens out around -24 dBFS instead of growing.
const RING_CEIL = 0.08, SOFT_CLIP = (()=>{ const n=4096, c=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=RING_CEIL*Math.tanh(x/RING_CEIL); } return c; })();

const fxRing = ({f, fb=(f<1200?1.2:1.05), state, q=5}) => (c,inp)=>{   // low rings need a little more loop gain to build on a real voice
  const sum=c.createGain(); inp.connect(sum);

  const d=c.createDelay(0.1); d.delayTime.value=Math.max(0.006, Math.round(f*0.01)/f);

  const clip=c.createWaveShaper(); clip.curve=SOFT_CLIP;   // keeps a runaway ring from ever getting dangerously loud
  sum.connect(d); d.connect(bp).connect(notch).connect(g).connect(clip).connect(sum);
  if(state) state.node=notch;
  const lim=c.createDynamicsCompressor(); lim.threshold.value=-20; lim.ratio.value=8; lim.attack.value=0.003; lim.release.value=0.2;

/* ----- Sunday line check: solo each channel and find the problem ----- */
// One channel on its own, level-matched so every channel solos at about the same loudness.
function soloSrc(song, k, off, target=-24){
  const b=A.buf[`${song.id}:${k}`], sr=b.sampleRate, s0=Math.floor(off*sr), n=Math.floor(song.len*sr); let e=0, c=0;
  for(let ch=0;ch<b.numberOfChannels;ch++){ const d=b.getChannelData(ch); for(let i=s0;i<s0+n&&i<d.length;i+=4){ e+=d[i]*d[i]; c++; } }
  const rms=10*Math.log10(e/Math.max(1,c)+1e-12);
  return { b:`${song.id}:${k}`, db:target-rms, off, dur:song.len, rms };
}

  crackle:{ label:'Crackling or cutting out',     fix:'A bad cable or a loose connector. Gently wiggle the connectors to find it, and swap the cable before the service starts.' },

function lineSpec(song, k, off, prob){

/* ----- Pastor walks up: a timing game ----- */
function runWalkup(q){
  const c=A.ctx, song=songById(q.song), st=q.state; stopAll(); if(c.state!=='running') c.resume();
  const t0=c.currentTime+0.15, lead = q.level===3 ? 1+Math.random()*0.8 : 2+Math.random()*1.5, C=2.5+Math.random()*2, T=C+lead;
  Object.assign(st, {t0, C, T, mic:null, band:null, running:true, done:false});
  // The band, looping the end of a chorus. Below level 2 it winds itself down when the pastor starts walking.
  const bandBus=c.createGain(); bandBus.connect(A.master); st.bandBus=bandBus;
  const off=pickWin(song,'full');
  A.nodes.push(graph(c, {src:BAND(song,{},off).map(x=>({...x, loop:true}))}, bandBus, t0));
  if(!q.needBand){ bandBus.gain.setValueAtTime(1, t0+C); bandBus.gain.linearRampToValueAtTime(db(-14), t0+C+2); }
  // The pastor: faint from the room until the mic comes up.
  const room=c.createGain(); room.gain.value=db(-22); const mic=c.createGain(); mic.gain.value=0; st.mic_g=mic;
  const pastor=c.createGain(); pastor.connect(room).connect(A.master); pastor.connect(mic).connect(A.master);
  A.nodes.push(graph(c, {src:VOICE(q.voiceName, 0).map(x=>({...x, at:T}))}, pastor, t0));
  const say=(t,msg)=>setTimeout(()=>{ if(!st.running) return; const el=document.getElementById('walkStatus'); if(el) el.textContent=msg; }, (t0-c.currentTime+t)*1000);
  say(0, 'The worship leader is finishing the song…');
  say(C, 'The pastor is walking up to the pulpit…');
  setTimeout(()=>{ if(st.running) finishWalkup(q); }, (t0-c.currentTime+T+3.2)*1000);
}
function finishWalkup(q){
  const st=q.state, L=UI.lesson; if(!st.running || UI.screen!=='lesson') return; st.running=false;
  const r=x=>Math.abs(x).toFixed(1), notes=[];
  let ok=true;
  if(st.mic==null || st.mic>st.T+0.2){ ok=false; notes.push(st.mic==null?'The pastor\'s mic never came up, so the room only heard him faintly.':`The mic came up ${r(st.mic-st.T)} s after he started talking, so his first words were lost.`); }
  else if(st.mic<st.C-0.3){ ok=false; notes.push('The mic came up before he even started walking. An open mic on an empty pulpit picks up the band and can feed back.'); }
  else notes.push(`You opened the mic ${r(st.T-st.mic)} s before his first word. That's anticipating!`);
  if(q.needBand){
    if(st.band==null){ ok=false; notes.push('The band stayed loud underneath him, so he was fighting the band.'); }
    else if(st.band>st.T+1.5){ ok=false; notes.push(`The band came down ${r(st.band-st.T)} s after he started. Bring it down as he begins.`); }
    else if(st.band<st.C-0.3){ ok=false; notes.push('The band came down before the song was even over.'); }
    else notes.push('The band came down under him at the right moment.');
  }
  q.explain = notes.join(' ') + ' Watch the stage and the order of service, so you\'re moving before the moment, not after.';
  L.picked = ok ? 0 : 1; q.right = ok; if(ok) L.correct++;
  stopAll(); render();
}

const QUAL=['','m','m','','','m','°'], NUMS=['1','2-','3-','4','5','6-','7°'];
const WORSHIP_KEYS=['C','D','E','F','G','A','B','Bb','Eb','Ab','Db'];
const keyOf = name => { const li=LETTERS.indexOf(name[0]); return { name, li, pc:(LETTER_PC[li]+(name[1]==='b'?11:name[1]==='#'?1:0))%12 }; };
// Spell scale degree d (1–7) of a major key with the right letter (so it's F# in D, not Gb).
function degreeNote(k, d){
  const li=(k.li+d-1)%7, pc=(k.pc+MAJOR[d-1])%12, diff=(pc-LETTER_PC[li]+12)%12;
  return LETTERS[li]+(diff===1?'#':diff===11?'b':diff===2?'##':diff===10?'bb':'');
}
const chordOf = (k,d) => degreeNote(k,d)+QUAL[d-1];
const keyMap = k => [1,2,3,4,5,6,7].map(d=>`${NUMS[d-1]} = ${chordOf(k,d)}`).join(', ');
// The key a half or whole step up, spelled the way charts usually spell it.
const PREFERRED=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const keyUp = (k, semis) => PREFERRED[(k.pc+semis)%12];
const distract = (right, pool) => [right, ...shuffle(pool.filter(x=>x!==right)).slice(0,3)];

// A synthesized worship-band sketch: pad, bass and a simple "singer" whose pitch can be run through a simulated tuner.
// chords: [{pc, q:'maj'|'min'|'dim'}], mel: [{m:midi, b:beat, l:beats}], tuner: {mode:'off'|'scale'|'chromatic', pcs:[...], speed:'gentle'|'fast'}
function synthSong({chords, beatsPer=2, bpm=92, mel=[], devs, tuner={mode:'off'}}){
  const beat=60/bpm, len=chords.length*beatsPer*beat;
  // the singer's natural pitch: a scoop into each note, a small tuning error, and vibrato
  const R=100, N=Math.ceil(len*R), pitch=new Float32Array(N), on=new Uint8Array(N);
  mel.forEach((n,i)=>{ const a=Math.floor(n.b*beat*R), b=Math.min(N,Math.floor((n.b+n.l)*beat*R)), dev=(devs&&devs[i])||0;
    for(let j=a;j<b;j++){ const t=(j-a)/R; pitch[j]=n.m+dev-0.8*Math.exp(-t/0.05)+(t>0.25?0.22*Math.sin(2*Math.PI*5.5*t):0); on[j]=1; } });
  for(let j=1;j<N;j++) if(!on[j]) pitch[j]=pitch[j-1]||pitch.find(x=>x)||60;
  // the tuner: pull each moment of pitch toward the nearest allowed note
  const out=new Float32Array(N); let corr=0;
  const allowed = p => tuner.mode==='chromatic' ? Math.round(p) : (()=>{ let best=Math.round(p), bd=9; for(let m=Math.floor(p)-2;m<=Math.ceil(p)+2;m++) if(tuner.pcs.includes(((m%12)+12)%12) && Math.abs(m-p)<bd){ bd=Math.abs(m-p); best=m; } return best; })();
  const a = tuner.speed==='fast' ? 1 : 1-Math.exp(-1/(R*0.06));
  for(let j=0;j<N;j++){ const p=pitch[j]; if(tuner.mode==='off'){ out[j]=p; continue; } corr += ((allowed(p)-p)-corr)*a; out[j]=p+corr; }
  const freq=Float32Array.from(out, m=>440*Math.pow(2,(m-69)/12));
  return { src:[], len:len+0.6, synth:(c, out, t0)=>{
    const dest=c.createGain(); dest.gain.value=db(-7); dest.connect(out);   // level-matched to the other drills
    const tri=(f,g,t,d)=>{ const o=c.createOscillator(); o.type='triangle'; o.frequency.value=f; const e=c.createGain(); e.gain.setValueAtTime(0.0001,t); e.gain.exponentialRampToValueAtTime(g,t+0.05); e.gain.setValueAtTime(g,t+d-0.15); e.gain.exponentialRampToValueAtTime(0.0001,t+d+0.2); o.connect(e).connect(dest); o.start(t); o.stop(t+d+0.25); };
    chords.forEach((ch,i)=>{ const t=t0+i*beatsPer*beat, d=beatsPer*beat, iv=ch.q==='maj'?[0,4,7]:ch.q==='min'?[0,3,7]:[0,3,6];
      iv.forEach(x=>{ tri(440*Math.pow(2,(48+ch.pc+x+12-69)/12),0.05,t,d); tri(440*Math.pow(2,(48+ch.pc+x-69)/12),0.045,t,d); });
      tri(440*Math.pow(2,(36+ch.pc-69)/12),0.16,t,d); });
    if(mel.length){
      const o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueCurveAtTime(freq, t0, N/R);
      const amp=c.createGain(); amp.gain.value=0;
      const f=(type,fr,g=0,q=1)=>{ const b=c.createBiquadFilter(); b.type=type; b.frequency.value=fr; b.gain.value=g; b.Q.value=q; return b; };
      o.connect(f('lowpass',3200)).connect(f('peaking',700,10,1.5)).connect(f('peaking',1200,8,2)).connect(f('peaking',2600,6,3)).connect(amp).connect(dest);
      mel.forEach(n=>{ const t=t0+n.b*beat; amp.gain.setTargetAtTime(0.11,t,0.02); amp.gain.setTargetAtTime(0,t+n.l*beat-0.06,0.03); });
      o.start(t0); o.stop(t0+len+0.3);
    }
  } };
}

function melodyFor(chords, beatsPer=2){

/* ----- "Fit it in the mix": ride one channel's fader until it sits in the band ----- */
function fitRole(song, k){
  const n=(song.name[k]||k).toLowerCase();
  if(k===song.vocal || song.leads.includes(k)) return ['lead vocal','The lead vocal carries the words. It sits on top: every word clear, but still part of the band, not floating above it.'];
  if(isVocal(song,k)) return ['background vocal','Background vocals support the lead. They blend just under it, so you hear the harmony without competing words.'];
  if(/kick/.test(k+n)) return ['kick','The kick is the heartbeat. You should feel it under everything without it covering the bass.'];
  if(/snare/.test(k+n)) return ['snare','The snare is the backbeat that holds the time. Clear on 2 and 4, but not cracking over the vocal.'];
  if(/tom|rack|floor/.test(k+n)) return ['toms','Toms are for fills. They should be full when they hit, without booming over the band.'];
  if(/oh|over|hat|cym/.test(k+n)) return ['cymbals','The overheads add shimmer and the whole kit\'s picture. Too loud and the mix turns harsh and splashy.'];
  if(/bass/.test(k+n)) return ['bass','The bass is the foundation, with the kick. Too low and the mix is thin; too loud and it gets boomy and covers everything.'];
  if(/acc|acoustic/.test(k+n)) return ['acoustic','The acoustic adds strum and rhythm. It fills in around the vocal, not on top of it.'];
  if(/gtr|elec|guitar/.test(k+n)) return ['electric','The electric adds color and energy. It fills the space around the vocal without stepping on the words.'];
  if(/key|piano|b3|organ|pad|synth/.test(k+n)) return ['keys','Keys and pads glue the band together. Usually they\'re felt more than heard: you\'d miss them if they were gone.'];
  return ['track','Tracks and loops add texture. They sit under the live band.'];
}

const lessonUsed = () => { const L=typeof UI!=='undefined' && UI.lesson; return L ? (L.used = L.used || new Map()) : new Map(); };
const freshFirst = (items, key) => { const u=lessonUsed(), age=x=>u.has(key(x)) ? u.get(key(x)) : -1; return shuffle(items).sort((a,b)=>age(a)-age(b)); };

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// Builds the whole board: every channel through its own high-pass and fader, plus a post-fader
// send from every vocal into two stereo FX returns (Luke's setup: vocal reverb and vocal delay).
// Channel EQ: low shelf (120 Hz), a sweepable mid, high shelf (8 kHz).
const EQ_FLAT = {lo:0, mg:0, mf:1000, hi:0};
const eqNode = (c, {type, f, g=0, q=0.9}) => { const b=c.createBiquadFilter(); b.type=type; b.frequency.value=f; b.gain.value=g; b.Q.value=q; return b; };

// Tone problems for Quick mix: each one is a filter, plus what to call it and how to fix it.
const TONE_PROBS = [
  { id:'mud',   f:{type:'peaking',  f:300,  g:9, q:1.2}, name:'muddy',  fix:'cut around 250–400 Hz' },
  { id:'boxy',  f:{type:'peaking',  f:600,  g:9, q:1.4}, name:'boxy',   fix:'cut around 500–800 Hz' },
  { id:'honk',  f:{type:'peaking',  f:1100, g:9, q:1.4}, name:'honky',  fix:'cut around 1 kHz' },
  { id:'harsh', f:{type:'peaking',  f:3000, g:9, q:1.4}, name:'harsh',  fix:'cut around 2.5–4 kHz' },
  { id:'boom',  f:{type:'lowshelf', f:150,  g:9},        name:'boomy',  fix:'turn the low EQ down (or high-pass it)' },
  { id:'dull',  f:{type:'highshelf',f:6000, g:-9},       name:'dull',   fix:'turn the high EQ up' }

// How far a channel's sound still is from "fixed": the problem plus your EQ, measured across the spectrum.
function eqResidual(prob, e){
  const fs=Float32Array.from({length:28},(_,i)=>60*Math.pow(200,i/27)), mag=new Float32Array(28), ph=new Float32Array(28), tot=new Float32Array(28);
  const nodes=[prob, {type:'lowshelf',f:120,g:e.lo}, {type:'peaking',f:e.mf,g:e.mg,q:1.2}, {type:'highshelf',f:8000,g:e.hi}];
  for(const nd of nodes){ eqNode(A.ctx, nd).getFrequencyResponse(fs, mag, ph); for(let i=0;i<28;i++) tot[i]+=20*Math.log10(mag[i]+1e-9); }
  return Math.max(...tot.map(Math.abs));   // the worst point: an untouched problem is ~9 dB off
}
function mixGraph(c, song, level, dest, gain, hpf, {loop, t0, analyse, eqf=()=>EQ_FLAT, probs=()=>[]}){
  const bars=mixBars(song, level), off=at(song,bars[0]), dur=(bars[1]-bars[0])*song.bar;
  const res={srcs:[], gains:{}, ans:{}, hp:{}, eq:{}}, send=c.createGain();
  const strip=(k, input)=>{
    const hp=c.createBiquadFilter(); hp.type='highpass'; hp.Q.value=0.707; hp.frequency.value=hpf(k);
    let n=input.connect(hp);
    for(const pf of probs(k)) n=n.connect(eqNode(c, pf));                     // a hidden tone problem (Quick mix)
    const e=eqf(k), lo=eqNode(c,{type:'lowshelf',f:120,g:e.lo}), mid=eqNode(c,{type:'peaking',f:e.mf,g:e.mg,q:1.2}), hi=eqNode(c,{type:'highshelf',f:8000,g:e.hi});
    const g=c.createGain(); g.gain.value=gain(k); n.connect(lo).connect(mid).connect(hi).connect(g); g.connect(dest);
    if(analyse){ const an=c.createAnalyser(); an.fftSize=1024; g.connect(an); res.ans[k]=an; }
    res.gains[k]=g; res.hp[k]=hp; res.eq[k]={lo,mid,hi}; return g;
  };
  const chs=missionCh(song, level);
  for(const k of chs){
    if(FX.includes(k)) continue;
    if(k==='mc'){   // the speaker: starts talking at their bar
      const sp=song.speaker, b=A.buf['speech:'+sp.voice], n=c.createBufferSource(); n.buffer=b;
      const pre=c.createGain(); pre.gain.value=db(A.speechDb[sp.voice]-song.trim); n.connect(pre);
      const tSpeak=(sp.bar-bars[0])*song.bar; if(tSpeak<dur) n.start(t0+tSpeak, 0, Math.min(b.duration, dur-tSpeak));
      strip(k, pre); res.srcs.push(n); continue;
    }
    const b=A.buf[`${song.id}:${k}`], n=c.createBufferSource(); n.buffer=b;
    if(loop){ n.loop=true; n.loopStart=off; n.loopEnd=Math.min(off+dur, b.duration); n.start(t0, off); } else n.start(t0, off, Math.min(dur, b.duration-off));
    const g=strip(k, n); if(isVocal(song,k)) g.connect(send); res.srcs.push(n);
  }

  if(chs.includes('vdly')) strip('vdly', stereoDelayWet(c, send, {l:song.beat/2, r:song.beat*0.75, fb:0.3}));

}
// What's happening in the run right now (and what's coming), by bar.
function runCue(bar){
  if(bar<16) return 'Soft opening: keys, acoustic and vocals.';
  if(bar<20) return 'Get ready: the full band comes in at bar 20…';
  if(bar<118) return 'Full band. Keep the vocals on top.';
  if(bar<125) return 'The song is ending soon. Find the MC\'s fader and put your hand on it.';
  if(bar<145) return 'The band drops out: keys pad and Vox 3.';
  if(bar<153) return 'The MC is walking up to speak…';
  return 'The MC is speaking.';
}
function runSample(song, bars){
  const m=UI.mix; if(!m || !MX.playing) return;
  const t=A.ctx.currentTime-MX.runT0; if(t<0) return;
  const bar=bars[0]+t/song.bar, eff={}; for(const k in m.g) eff[k]=m.mute[k]?FADER_MIN:+m.g[k];
  m.runLog.push({t, bar, eff});
  const len=(bars[1]-bars[0])*song.bar, pr=document.getElementById('run-prog'), cue=document.getElementById('run-cue');
  if(pr) pr.style.width=Math.min(100,t/len*100)+'%'; if(cue) cue.textContent=runCue(bar);
}
// Balance at one moment: how close each channel is to the reference, relative to the lead vocal.
function balanceAt(song, eff, chans){
  const v=eff[song.anchor]; if(v==null || v<=FADER_MIN) return {frac:0, err:{}};
  let pts=0, n=0; const err={};
  for(const k of chans){ if(k===song.anchor||song.traps.includes(k)||FX.includes(k)||k==='mc') continue;
    const target=styleRef(song,k)-styleRef(song,song.anchor), rel=eff[k]<=FADER_MIN?-60:eff[k]-v, a=Math.abs(rel-target);
    err[k]=rel-target; n++; pts += a<=3?1 : a<=6?0.6 : a<=10?0.25 : 0; }
  return {frac:n?pts/n:1, err};
}
function finishRun(){
  const m=UI.mix; if(!m || !m.run) return;
  clearInterval(MX.runTimer); clearTimeout(MX.runEnd); stopMixer();
  const song=mixSong(), log=m.runLog, chans=missionCh(song,m.level), notes=[], avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  // 1. the song: balance over time, plus which channels drifted most
  const songLog=log.filter(e=>e.bar>=20 && e.bar<124), errSum={};
  const bal=avg(songLog.map(e=>{ const b=balanceAt(song,e.eff,chans); for(const k in b.err) (errSum[k]=errSum[k]||[]).push(b.err[k]); return b.frac; }));
  for(const k in errSum){ const e=avg(errSum[k]); if(Math.abs(e)>4) notes.push({k, err:Math.abs(e), bad:Math.abs(e)>7, msg:`On average about ${Math.round(Math.abs(e))} dB too ${e>0?'loud':'quiet'} during the song`}); }
  // traps left open (click, crowd mics in the house)
  let leaks=0; for(const k of song.traps.filter(k=>chans.includes(k))){ const open=log.filter(e=>e.eff[k]>-30).length/Math.max(1,log.length); if(open>0.3){ leaks++; notes.push({k, bad:true, leak:1, msg:TRAP_MSG[k]+' Mute it.'}); } }

  if(m.level===5){
    const sp=song.speaker, pad=log.filter(e=>e.bar>=126 && e.bar<152), talk=log.filter(e=>e.bar>=sp.bar+1);
    // 2. the pad and Vox 3 after the band drops out
    const padOk=avg(pad.map(e=> (e.eff.vox3>=styleRef(song,'vox3')-8 ? 0.5:0) + (Math.abs(e.eff.keys-styleRef(song,'keys'))<=8 ? 0.5:0)));
    if(padOk<0.7) notes.push({k:'keys', bad:true, msg:'After the band dropped out, keep the keys pad and Vox 3 up: that moment still matters.'});
    // 3. the MC's mic: up before the first word, but not open during the song
    const up=log.find(e=>e.eff.mc>-12), late = up ? (up.bar-sp.bar)*song.bar : Infinity;
    let timing = !up ? 0 : up.bar<125 ? 0.5 : late<=0.35 ? 1 : Math.max(0, 1-late/3);
    notes.unshift({k:'mc', good:timing===1, bad:timing<0.6, msg: !up ? 'The MC\'s mic never came up, so nobody heard them.' : up.bar<125 ? 'The MC\'s mic was open during the song. Bring it up as they walk up, not before.' : late<=0.35 ? `Mic up ${Math.abs(late).toFixed(1)} s before the first word. Nicely anticipated!` : `Mic up ${late.toFixed(1)} s after they started talking, so the first words were lost.`});

    const tuck=avg(talk.map(e=> e.eff.keys<=FADER_MIN || e.eff.keys-styleRef(song,'keys')<=-6 ? 1 : 0));

    if(tuck<0.7) notes.push({k:'keys', bad:true, msg:'Tuck the keys pad under the MC (about 6 dB or more) so the words are clear.'});
    if(mcLvl<0.7) notes.push({k:'mc', bad:true, msg:'Keep the MC\'s level steady once they\'re talking.'});

  notes.sort((x,y)=>((y.leak||0)-(x.leak||0))||(y.bad-x.bad)||((y.err||0)-(x.err||0)));
  m.result={ score: Math.max(0, Math.round(score) - 25*leaks), notes, leaks };
  render();
}
// What the board plays: the mission's bars, or the section you picked to loop.
function mixBars(song, level){
  const m=UI.mix, sec = m && m.song===song.id && !m.run && song.sections && m.sec!=null ? song.sections[m.sec] : null;
  return sec ? sec.bars : song.missions[level].bars;
}
// The section playing right now (for "Now playing" while you loop a long stretch).
function sectionAt(song, bar){ return (song.sections||[]).find(x=>bar>=x.bars[0] && bar<x.bars[1]); }
function nowLoop(){
  clearInterval(MX.nowT); const song=mixSong(); if(!song.sections) return;
  MX.nowT=setInterval(()=>{ const el=document.getElementById('mx-now'); if(!el||!MX.playing) return;
    const bars=mixBars(song, UI.mix.level), len=(bars[1]-bars[0])*song.bar, t=((A.ctx.currentTime-MX.t0)%len+len)%len, x=sectionAt(song, bars[0]+t/song.bar);

function stopMixer(){

function meterLoop(){

    MX.ans[k].getFloatTimeDomainData(meterBuf);
    let pk=0; for(let i=0;i<meterBuf.length;i++){ const a=Math.abs(meterBuf[i]); if(a>pk) pk=a; }

function scoreMix(){
  const m=UI.mix, song=mixSong(), eff = k => m.mute[k] ? FADER_MIN : +m.g[k], v=eff(song.anchor), notes=[];
  if(v<=FADER_MIN) return { score:0, notes:[{k:song.anchor, bad:true, msg:'Off! The lead vocal carries the message.'}] };
  let pts=0, n=0, leaks=0;
  for(const k of missionCh(song, m.level).filter(k=>k!==song.anchor)){   // everything is judged relative to the lead vocal
    if(isTrap(song,k)){
      if(eff(k)>-30){ leaks++; notes.push({k, bad:true, leak:1, msg:TRAP_MSG[k]+' Mute it.'}); }
      else notes.push({k, good:true, msg:'Kept out of the house'});

    }
    if(FX.includes(k)){
      if(curStyle()!=='modern') continue;   // effects are up to you in gospel style
      const t=styleRef(song,k), e=(eff(k)<=FADER_MIN?-60:eff(k))-t, a=Math.abs(e);
      n++; pts += a<=4?1 : a<=8?0.6 : a<=12?0.25 : 0;

    let ok=0, total=0;
