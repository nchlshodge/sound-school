    {t:'dBA and dBC', p:['A-weighting (dBA) follows how our ears hear at normal levels, so it mostly ignores deep bass. C-weighting (dBC) includes the low end.','A bass-heavy mix can read fine in dBA but be overwhelming in dBC. Many churches watch both.']},
    {t:'Average and peak', p:['Leq is the average over time (say, a 15-minute worship set). Peak is the loudest moment.','Pick targets as a team and measure them the same way every week. For reference, Luke Hendrickson said Bethel\'s peak limits were 88 dB for the early service and 92 dB for the second.']},
    {t:'How long is safe?', p:['The NIOSH guideline: 85 dBA is safe for 8 hours, and every 3 dB louder cuts the time in half. 88 dBA: 4 hours. 91: 2 hours. 94: 1 hour. 97: 30 minutes. 100: 15 minutes.','Rehearsal plus two services adds up. Wear good earplugs in rehearsal, and keep in-ear levels moderate.']},
    {t:'Ear fatigue', p:['After loud exposure your ears go dull for a while (a temporary threshold shift), so you turn up to compensate and the mix creeps louder.','Protect your ears before you mix, take short breaks, and trust the meter over your ears late in the day.']},
    {t:'Louder fools us', p:['At lower volumes we hear less bass and treble, so the same mix sounds thinner when quiet and "better" when loud. Compare changes at the same level, and check your mix at the volume people will actually hear it.'],
      demos:[{label:'Normal level',spec:()=>({src:BAND(D())})},{label:'15 dB quieter',spec:()=>({src:BAND(D()),gain:-15})}]},
    {t:'Loudness on the stream', p:['Streaming platforms measure loudness in LUFS and turn loud streams down. YouTube plays back at about -14 LUFS, so crushing the stream louder only costs you punch.','Keep true peaks under about -1 dBTP. Logic\'s Loudness Meter shows LUFS if you\'re checking a recording.']}
  ]},
  { id:'eq', title:'EQ', mascot:'fenn', who:'Fenn the fennec fox', color:'#A8540A', blurb:'Find frequencies by ear in music and voices, and ring out feedback.', learn:[
    {t:'What EQ does', p:['EQ turns certain frequencies up or down.','Lows (20–250 Hz) are rumble and weight. Mids (250 Hz–4 kHz) are body and words. Highs (4–16 kHz) are air and sizzle.'],
      demos:[{label:'Flat',spec:()=>({src:PINK(D())})},{label:'Lows up',spec:()=>({src:PINK(D()),chain:fxEQ(100,12)})},{label:'Mids up',spec:()=>({src:PINK(D()),chain:fxEQ(1000,12)})},{label:'Highs up',spec:()=>({src:PINK(D()),chain:fxEQ(8000,12)})}]},
    {t:'Words for problems', p:['Boom ≈ 100 Hz · Mud ≈ 250 Hz · Boxy ≈ 500 Hz','Honk ≈ 1 kHz · Harsh ≈ 3 kHz · Sizzle ≈ 8 kHz','Learn these and you can turn "it sounds muddy" into a knob.'],
      demos:[{label:'Flat',spec:()=>({src:BAND(D())})},{label:'Muddy',spec:()=>({src:BAND(D()),chain:fxEQ(250,10,1.8)})},{label:'Harsh',spec:()=>({src:BAND(D()),chain:fxEQ(3000,10,1.8)})}]},
    {t:'Cut before you boost', p:['Fixing a problem usually means cutting the bad part, not boosting everything else.','Use a high-pass filter on every mic that doesn\'t need lows (vocals, pastor, acoustic guitar), usually around 80–120 Hz.']},
    {t:'Starting points', p:['Every instrument has a usual place to start: where to high-pass, what to cut, and what (if anything) to boost.','<button class="btn ghost" data-act="eqGuide" data-back="learn">Open EQ starting points</button>']},
    {t:'Sweep to find it', p:['Can\'t tell where a problem is? Boost a narrow band, sweep slowly until the problem jumps out, then turn that boost into a cut.']},
    {t:'EQ for the spoken word', p:['A speaking voice needs to be clear, not big. High-pass every speaking mic around 80–120 Hz, cut mud around 200–300 Hz if it sounds thick, and add only a touch around 2–4 kHz for clarity.','These are real voices from one of our Sundays: the pastor\'s sermon mic and the announcements mic.'],
      demos:[{label:'Natural',spec:()=>({src:VOICE('pastor',4)})},{label:'Muddy',spec:()=>({src:VOICE('pastor',4),chain:fxEQ(300,9,1.4)})},{label:'Clear',spec:()=>({src:VOICE('pastor',4),chain:chainOf(fxEQ(300,-3,1.4),fxEQ(3000,3,1))})}]},
    {t:'Three mics, three problems', p:['Handheld: held too close it gets boomy (proximity effect), with "p" pops and handling noise.','Headset: right at the mouth it gets harsh "S" sounds and breaths. Lapel: on the chest it sounds boxy and dull, picks up clothing rustle, and drops when the speaker turns their head.'],
      demos:[{label:'Handheld',spec:()=>({src:VOICE('pastor',4),chain:MICS.handheld.chain()})},{label:'Headset',spec:()=>({src:VOICE('mc',4),chain:MICS.headset.chain()})},{label:'Lapel',spec:()=>({src:VOICE('pastor',10),chain:MICS.lapel.chain()})}]},
    {t:'Feedback and ringing', p:['Feedback is a loop: the mic hears the speakers and one frequency builds into a ring. Lapels ring most, because they sit farther from the mouth and need more gain.','Break the loop first: pull that fader down a little. Then fix the cause. Keep mics and people behind the main speakers, and away from floor wedges.','Don\'t cut the ring on that person\'s channel: it changes their voice. If the same frequency rings on every mic, cut a few dB of it on the main L/R EQ (or have the system tuned).'+HOT_CREDIT],
      demos:[{label:'Ringing',spec:()=>({src:VOICE('pastor',4),chain:fxRing({f:2500}),tail:1.5})},{label:'Rung out',spec:()=>({src:VOICE('pastor',4),chain:fxRing({f:2500,state:{f:2500}}),tail:1.5})}]}
  ]},
  { id:'phase', title:'Phase & Polarity', mascot:'fenn', who:'Fenn the fennec fox', color:'#B45309', blurb:'Hear two mics fight, flip the polarity, and fix timing.', learn:[
    {t:'Two mics, one sound', p:['When two mics hear the same source (kick in and out, snare top and bottom, bass DI and amp), their signals add together. If they disagree, they cancel, and you lose low end and punch.']},
    {t:'Polarity: the flip', p:['The polarity button (Ø) flips a signal upside down. If two mics are working against each other, flipping one can bring the whole low end back.','In the live recordings in this app, flipping the kick-out mic adds about 4 dB of low end, and so does flipping the snare bottom. The bass DI and amp were already fine.', onM32('the Ø button in the channel\'s preamp/config section, near 48V.')],
      demos:[{label:'Kick: fighting',spec:()=>{ const ps=pairSongs()[0]; return ps?{src:pairSrc(ps,PAIRS[0],false,at(ps,ps.win.full[0]))}:{src:VOCAL(D()),chain:fxComb(1)}; }},{label:'Kick: flipped',spec:()=>{ const ps=pairSongs()[0]; return ps?{src:pairSrc(ps,PAIRS[0],true,at(ps,ps.win.full[0]))}:{src:VOCAL(D())}; }}]},
    {t:'Phase: timing', p:['Sound travels about a foot (34 cm) every millisecond. Two mics at different distances hear it at slightly different times, and the mix sounds hollow and phasey: comb filtering.','Polarity can\'t fully fix a timing problem. Move the mics so they\'re the same distance away, or delay the closer one (many consoles have channel delay; Waves InPhase does it too).'],
      demos:[{label:'One mic',spec:()=>({src:VOCAL(D())})},{label:'Two mics, 1 ms apart',spec:()=>({src:VOCAL(D()),chain:fxComb(1)})}]},
    {t:'How to check', p:['Bring up both mics together, flip one, and keep whichever sounds fuller in the low end. Snare bottom mics almost always get flipped.','Do it at soundcheck, and save it in the scene so it\'s right every week.']}
  ]},
  { id:'gate', title:'Gates', mascot:'kit', who:'Kit the meerkat', color:'#2F7A2F', blurb:'Hear when a gate opens, closes, and chops.', learn:[
    {t:'What a gate does', p:['A gate mutes a channel when it drops below a threshold, and opens when the sound is loud enough. Like me: I only pop up when something\'s loud enough.','This vocal channel has hiss and hum on it. Listen in the pause between lines.'],
      demos:[{label:'Gate off',spec:()=>gateClip(D(),at(D(),D().win.gap[0]),-26,'off')},{label:'Gate on',spec:()=>gateClip(D(),at(D(),D().win.gap[0]),-26,'good')}]},
    {t:'Threshold', p:['Set the threshold just above the noise you want gone. Too high, and I chop off soft words and the ends of notes.'],
      demos:[{label:'Just right',spec:()=>gateClip(D(),at(D(),D().win.gap[0]),-26,'good')},{label:'Too high',spec:()=>gateClip(D(),at(D(),D().win.gap[0]),-26,'high')}]},
    {t:'Where gates help', p:['Toms, kick drums and noisy guitar amps. On a live stage, a tom mic hears the whole band; a gate keeps it quiet until the tom is hit.','Be careful on pastor and vocal mics. A gate that chops soft words is worse than a little noise.']}
  ]},
  { id:'comp', title:'Compression', mascot:'hugo', who:'Hugo the koala', color:'#B8336F', blurb:'Hear dynamics get evened out, and squashed.', learn:[
    {t:'What compression does', p:['A compressor turns down the loud moments so loud and soft parts sit closer together. Think of it as a hug that keeps things steady.','Listen to how even the words are.'],
      demos:[{label:'Original',spec:()=>({src:VOCAL(D())})},{label:'Compressed',spec:()=>({src:VOCAL(D()),chain:fxComp(D().comp.vocalHeavy)})}]},
    {t:'Threshold and ratio', p:['Threshold is where the hug starts. Ratio is how tight it is.','2:1 to 4:1 is gentle. 8:1 is firm. 20:1 is basically a limiter.']},
    {t:'Attack and release', p:['Attack is how fast I grab. Release is how fast I let go.','Too tight and too fast, and the whole mix pumps and loses its life.'],
      demos:[{label:'Gentle',spec:()=>({src:BAND(D()),chain:fxComp(D().comp.bandGentle)})},{label:'Squashed',spec:()=>({src:BAND(D()),chain:fxComp(D().comp.bandSquash)})}]},
    {t:'Makeup gain', p:['Compression makes things quieter, so we add makeup gain back. Compare at matched volume, so you hear the compression and not just "louder."']}
  ]},
  { id:'lim', title:'Limiters', mascot:'bram', who:'Bram the beaver', color:'#A63E2C', blurb:'Hear clipping, and the dam that stops it.', learn:[
    {t:'What a limiter does', p:['A limiter is a compressor with a hard ceiling: nothing goes over. I build the dam so a dropped mic or a shout doesn\'t flood the speakers.'],
      demos:[{label:'No limiter',spec:()=>({src:[...BAND(D(),{},undefined,-9),{b:'thump',at:2.6}]})},{label:'Limited',spec:()=>({src:[...BAND(D(),{},undefined,-9),{b:'thump',at:2.6}],chain:fxComp(D().comp.limit)})}]},
    {t:'Clipping', p:['When a signal goes past what the gear can handle, the tops get chopped off and it distorts. That crunch is clipping. Watch for red meters.'],
      demos:[{label:'Clean',spec:()=>({src:BAND(D())})},{label:'Clipping',spec:()=>({src:BAND(D()),chain:fxClip(D(),7)})}]},
    {t:'Where limiters live', p:['Usually on the main outputs and the livestream feed. It\'s a safety net, not a volume knob.','If the limiter is working all the time, the mix is too hot. Turn it down.']}
  ]},
  { id:'dly', title:'Delay', mascot:'echo', who:'Echo the parrot', color:'#2457C5', blurb:'Hear repeats, and keep them in time.', learn:[
    {t:'What delay does', p:['Delay repeats the sound after a set time. Feedback sets how many repeats you hear.'],
      demos:[{label:'Dry',spec:()=>({src:VOX(D())})},{label:'Delay',spec:()=>({src:VOX(D()),chain:fxDelay({time:D().beat,fb:0.35,wet:-5}),tail:2})}]},
    {t:'Slapback vs. long', p:['A slapback (80–120 ms) is one quick repeat that thickens a voice. A long delay (a quarter or half note) is a clear echo.'],
      demos:[{label:'Slapback',spec:()=>({src:VOX(D()),chain:fxDelay({time:0.11,fb:0,wet:-3})})},{label:'Long',spec:()=>({src:VOX(D()),chain:fxDelay({time:D().beat,fb:0.38,wet:-5}),tail:2})}]},
    {t:'Lock it to the tempo', p:['Delays sound best timed to the song. A quarter note in ms = 60,000 ÷ BPM.', LISTED().map(s=>`"${s.title}" is ${s.bpm} BPM, so a quarter note is ${s.ms} ms.`).join(' ')+' Most consoles have a tap-tempo button for this.']},
    {t:'Keep the pastor dry', p:['Delay on a spoken voice makes words hard to follow. Effects are for music.']}
  ]},
  { id:'verb', title:'Reverb', mascot:'verb', who:'Verb the whale', color:'#6A45C2', blurb:'Hear room size, and know when to hold back.', learn:[
    {t:'What reverb does', p:['Reverb is the sound of a space: thousands of reflections fading away. It makes a dry vocal feel like it belongs in the room.'],
      demos:[{label:'Dry',spec:()=>({src:VOX(D())})},{label:'Hall',spec:()=>({src:VOX(D()),chain:fxVerb({size:2,wet:-5}),tail:2.5})}]},
    {t:'Room size', p:['Small rooms fade fast (under 1 second). Halls ring for about 2 seconds. Cathedrals ring for 4 or more.'],
      demos:[{label:'Small',spec:()=>({src:VOCAL(D()),chain:fxVerb({size:0.6,wet:-3}),tail:1})},{label:'Hall',spec:()=>({src:VOCAL(D()),chain:fxVerb({size:2,wet:-3}),tail:2.5})},{label:'Cathedral',spec:()=>({src:VOCAL(D()),chain:fxVerb({size:4.5,wet:-3}),tail:5})}]},
    {t:'Plate vs. hall', p:['A plate is dense and bright from the very first instant: smooth, with no sense of a real room. It\'s the classic way to make a vocal shine and sit forward.','A hall starts after a short gap, has distinct early echoes, builds slowly and rings long and dark: big and spacious, for pads and ambient moments. A room is short and natural.'],
      demos:[{label:'Plate',spec:()=>({src:VOCAL(D()),chain:fxVerbType('plate'),tail:2.6})},{label:'Hall',spec:()=>({src:VOCAL(D()),chain:fxVerbType('hall'),tail:2.6})},{label:'Room',spec:()=>({src:VOCAL(D()),chain:fxVerbType('room'),tail:1.2})}]},
    {t:'Choosing a reverb', p:['Vocals: a plate with 20–40 ms of pre-delay is a common starting point, so the words speak first. Pads and ambient moments: a hall. Drums: a short room, or a plate on the snare.','Luke Hendrickson runs two reverbs on buses: one for the drums and one for the vocals. Two well-chosen reverbs beat ten.']},
    {t:'Hold back', p:['Our sanctuary already adds its own reverb. Add a little to singers, and almost none to speaking.','If you can clearly hear the reverb, it\'s probably too much.']},
    {t:'When the leader starts talking', p:['A worship leader sings with reverb, then reads Scripture into the same mic. Pull the reverb down before they speak.','The smooth way: mute the send that feeds the reverb, not the reverb return. What\'s already ringing fades out naturally, even if you\'re a little late.'+HOT_CREDIT],
      demos:[{label:'Left on',spec:()=>talkFxSpec(D(),'on')},{label:'Return muted',spec:()=>talkFxSpec(D(),'ret')},{label:'Send muted',spec:()=>talkFxSpec(D(),'send')}]}
  ]},
  { id:'moreFx', title:'More Effects', mascot:'echo', who:'Echo the parrot', color:'#1D5FA8', blurb:'Chorus, doubler, flanger, phaser, tremolo, rotary, drive and delay flavors.', learn:[
    {t:'Two families of effects', p:['Time effects (delay and reverb) and modulation effects (chorus, flanger, phaser, tremolo, rotary), plus drive.','Most modulation and drive live on the musicians\' pedalboards and keyboards. At the console you\'ll mostly add reverb, delay and maybe a doubler. Knowing them all helps you talk with the band and spot problems.']},
    {t:'Chorus and doubler', p:['Chorus layers slightly detuned, wobbling copies: shimmery. A doubler adds one copy a few milliseconds late, so it sounds like two takes: wider.'],
      demos:[{label:'Dry vocal',spec:()=>({src:VOCAL(D())})},{label:'Chorus',spec:()=>({src:VOCAL(D()),chain:FX_TYPES.chorus.fx(D())})},{label:'Doubler',spec:()=>({src:VOCAL(D()),chain:FX_TYPES.doubler.fx(D())})}]},
    {t:'Flanger and phaser', p:['A flanger is a very short sweeping delay with feedback: a jet-plane whoosh. A phaser sweeps notches through the sound: swirly and watery.','Both are mostly guitar and keys effects, used sparingly.'],
      demos:[{label:'Flanger',spec:()=>({src:[soloSrc(D(),'eg',at(D(),D().win.full[0]))],chain:FX_TYPES.flanger.fx(D())})},{label:'Phaser',spec:()=>({src:[soloSrc(D(),'piano',at(D(),D().win.full[0]))],chain:FX_TYPES.phaser.fx(D())})}]},
    {t:'Tremolo and rotary', p:['Tremolo pulses the volume. A rotary speaker (a Leslie) spins its horn, so the sound swirls side to side: the classic B3 organ sound.'],
      demos:[{label:'Tremolo',spec:()=>({src:[soloSrc(D(),'eg',at(D(),D().win.full[0]))],chain:FX_TYPES.tremolo.fx(D())})},{label:'Rotary',spec:()=>({src:[soloSrc(D(),'organ',at(D(),D().win.full[0]))],chain:FX_TYPES.rotary.fx(D())})}]},
    {t:'Drive', p:['Overdrive adds grit and sustain to an electric guitar. On a vocal or the main mix, that same crunch means something is clipping.'],
      demos:[{label:'Clean guitar',spec:()=>({src:[soloSrc(D(),'eg',at(D(),D().win.full[0]))]})},{label:'Overdrive',spec:()=>({src:[soloSrc(D(),'eg',at(D(),D().win.full[0]))],chain:FX_TYPES.drive.fx(D())})}]},
    {t:'Delay flavors', p:['Ping-pong bounces repeats left and right. Tape echo darkens and wobbles each repeat so it sits back. A digital delay repeats cleanly and brightly.'],
      demos:[{label:'Ping-pong',spec:()=>({src:VOX(D()),chain:FX_TYPES.pingpong.fx(D()),tail:2})},{label:'Tape echo',spec:()=>({src:VOX(D()),chain:FX_TYPES.tape.fx(D()),tail:2})},{label:'Digital',spec:()=>({src:VOX(D()),chain:FX_TYPES.digital.fx(D()),tail:2})}]},
    {t:'On Sunday', p:['Less is more: if people notice the effect, it\'s probably too much. Keep the pastor dry, and check with a musician before "fixing" their tone at the board.']}
  ]},
  { id:'live', title:'Livestream', mascot:'penny', who:'Penny the pigeon', color:'#7A5900', blurb:'Mix for the people who aren\'t in the room.', learn:[
    {t:'Two different audiences', p:['The room hears the speakers plus the band\'s own acoustic sound. The stream only hears your console, often on a phone.'],
      demos:[{label:'Full range',spec:()=>({src:BAND(D())})},{label:'On a phone',spec:()=>({src:BAND(D()),chain:fxPhone(D())})}]},
    {t:'Phones lose the lows', p:['Phone speakers can\'t reproduce bass. If the vocals aren\'t clear in the mids, people at home lose the words.']},
    {t:'Stream mix tips', p:['Vocals and the pastor usually need to be louder on the stream than in the room.','Crowd mics belong in the stream mix (so it feels like church), not in the house speakers.','Check the stream on a phone or cheap earbuds, and keep a limiter on the stream output.']}
  ]},
  { id:'mix', title:'Mixing', mascot:'sona', who:'Sona the bat', color:'#3F3399', blurb:'Hear what\'s out of balance in a full band.', learn:[
    {t:'Start with the message', p:['The words carry the message, so the pastor or lead vocal always ends up on top.','You build a song\'s mix from the drums up (drums, bass, band), then set the vocal on top of it. The message is where you finish, not where you start.']},
    {t:'What\'s too loud?', p:['Most mix problems are one thing too loud. Before you boost anything, ask what you can turn down.'],
      demos:[{label:'Balanced',spec:()=>({src:BAND(D())})},{label:'Drums too loud',spec:()=>({src:BAND(D(),{drums:8})})},{label:'Vocals buried',spec:()=>({src:BAND(D(),{lv1:-10,lv2:-10})})}]},
    {t:'A warm hug, not a pinprick', p:['When it feels too loud, look for what\'s sticking out, usually harsh upper mids or a buried vocal under a loud band.','Don\'t cut the low end to make it quieter: the highs then feel brighter and harsher. A full, balanced mix with healthy low end feels less loud, even at the same number on the meter.'+HOT_CREDIT],
      demos:[{label:'Balanced',spec:()=>({src:BAND(D())})},{label:'Low end cut (same level)',spec:()=>({src:BAND(D()),chain:fxLowCut(),gain:D().cal.lowcut||0})}]},
    {t:'Mostly mono in the house', p:['In most rooms only the seats near the middle hear both speakers. Pan the electric hard left and one side of the room loses it.','Keep sole instruments (one acoustic, the keys, the vocals) near the center. A little panning, like toms, is fine.'+HOT_CREDIT]},
    {t:'Serve the moment', p:['A quiet prayer needs a different mix than a big chorus. Watch the stage, know the setlist, and move before the moment, not after.','In the last 30 seconds of every song, find who\'s up next, find their fader, and put your hand on it.'+HOT_CREDIT]}
  ]},
  { id:'keys', title:'Keys & Auto-Tune', mascot:'echo', who:'Echo the parrot', color:'#6D28D9', blurb:'The Nashville Number System, and when to set Auto-Tune to major, chromatic or off.', learn:[
    {t:'Why numbers?', p:['The Nashville Number System names chords by where they sit in the key, not by letter. In the key of G, G is the 1, C is the 4 and D is the 5.','Change the key and the numbers stay the same. That\'s why bands use them, and why a sound tech who knows them can follow every call.']},
    {t:'The seven chords', p:['In a major key: 1, 2-, 3-, 4, 5, 6-, 7°. A minus sign (or a small m) means minor.','Key of G: G = 1, Am = 2-, Bm = 3-, C = 4, D = 5, Em = 6-, F#° = 7°. Key of D: D, Em, F#m, G, A, Bm, C#°.'],
      demos:[{label:'1 – 5 – 6- – 4 in G',spec:()=>synthSong({chords:chordsFor(keyOf('G'),['1','5','6-','4'])})},{label:'1 – 4 – 6- – 5 in G',spec:()=>synthSong({chords:chordsFor(keyOf('G'),['1','4','6-','5'])})}]},
    {t:'Reading a chart', p:['Each number is usually one bar. Slash chords put the second number in the bass: 1/3 in G is G/B.','You\'ll also see things like ♭7 (a borrowed chord), a diamond (hit it and let it ring), and key changes written at the top of a section.']},
    {t:'Why the sound tech cares', p:['Auto-Tune only works if you give it the right key. The setlist (in Planning Center) lists each song\'s key. Set the tuner before the song starts.','Listen for the leader\'s calls. "Key up a whole step!" means your tuner key has to move with the band.']},
    {t:'Major key: the everyday setting', p:['Set the song\'s key, major scale, and a gentle retune speed. Luke Hendrickson says Bethel has tuned every vocal this way for years, and at a gentle speed it\'s transparent.','Too fast a retune snaps every note and sounds robotic.'],
      demos:[{label:'Off',spec:()=>{ const k=keyOf('G'), ch=chordsFor(k,['1','5','6-','4']), m=melodyFor(ch); window.__devs=singerDevs(m.length); return synthSong({chords:ch, mel:m, devs:window.__devs}); }},
             {label:'Gentle, in G',spec:()=>{ const k=keyOf('G'), ch=chordsFor(k,['1','5','6-','4']), m=melodyFor(ch); return synthSong({chords:ch, mel:m, devs:window.__devs||singerDevs(m.length), tuner:{mode:'scale',pcs:scalePcs(k),speed:'gentle'}}); }},
             {label:'Too fast',spec:()=>{ const k=keyOf('G'), ch=chordsFor(k,['1','5','6-','4']), m=melodyFor(ch); return synthSong({chords:ch, mel:m, devs:window.__devs||singerDevs(m.length), tuner:{mode:'scale',pcs:scalePcs(k),speed:'fast'}}); }}]},
    {t:'When to go chromatic', p:['Chromatic allows all 12 notes. It still smooths pitch, but never drags a note into the wrong one.','Use it when a song steps outside the major scale (a 3 major chord, a ♭7, a minor 4), when you don\'t know the key yet, and in spontaneous worship that moves between keys.'],
      demos:[{label:'3 major, tuner in C',spec:()=>{ const k=keyOf('C'), ch=chordsFor(k,['1','3','6-','4']); ch[1]={pc:4,q:'maj'}; const m=melodyFor(ch); window.__d3=singerDevs(m.length); return synthSong({chords:ch, mel:m, devs:window.__d3, tuner:{mode:'scale',pcs:scalePcs(k),speed:'gentle'}}); }},
             {label:'Chromatic',spec:()=>{ const k=keyOf('C'), ch=chordsFor(k,['1','3','6-','4']); ch[1]={pc:4,q:'maj'}; const m=melodyFor(ch); return synthSong({chords:ch, mel:m, devs:window.__d3||singerDevs(m.length), tuner:{mode:'chromatic',speed:'gentle'}}); }}]},
    {t:'When to turn it off', p:['Talking, prayer and scripture over a pad: speaking voices glide, and a tuner makes them warble. Bypass it. The pastor\'s mic should never have it.','Also turn it off if it\'s audibly glitching on a singer, and for moments that are meant to be raw and free.']},
    {t:'A Sunday checklist', p:['Before each song: set the key from the setlist (or recall the song\'s snapshot).','At a key change: move the key with the band. Not sure? Chromatic. Talking? Off.']}
  ]},
  { id:'mw', title:'Modern Worship', mascot:'sona', who:'Sona, learning from Bethel', color:'#0F6E8C', blurb:'Mix like Bethel Church: Luke Hendrickson\'s approach to modern worship.', learn:[
    {t:'Learning from Bethel', p:['Luke Hendrickson oversees audio mixing at Bethel Church. In a Churchfront masterclass he describes mixing as a language: learn the rules first, then you can break them.','This unit follows his approach. It\'s one great style, not the only right way.']},

// Recorded character voices (Kokoro, made by tools/tts/): tts/<hash>.m4a for every fixed piece of text the app says.
// Anything not recorded (feedback with numbers in it) falls back to the device voice.
const ttsHash = str => { let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0'); };
const ttsId = (who, text) => ttsHash(who+'|'+sayable(text));
let TTS_SET=null, ttsRun=0, ttsNode=null;
const ttsReady = () => TTS_SET ? Promise.resolve(TTS_SET) : fetch('tts/index.json').then(r=>r.ok?r.json():[]).catch(()=>[]).then(a=>TTS_SET=new Set(a));
function speakDevice(id, text){
  return new Promise(done=>{
    if(!TTS){ done(); return; } const v=castVoice(id), c=CAST[id]||CAST.sona;
    const parts=(sayable(text).match(/[^.!?]+[.!?]*["')]*\s*/g) || [text]).filter(x=>x.trim()); if(!parts.length){ done(); return; }
    parts.forEach((part,i)=>{ const u=new SpeechSynthesisUtterance(part.trim()); if(v){ u.voice=v; u.lang=v.lang; } u.pitch=c.pitch; u.rate=c.rate; u.volume=Math.min(1,0.4+S.vol);
      if(i===parts.length-1){ u.onend=done; u.onerror=done; } speechSynthesis.speak(u); });
  });
}
async function speakRecorded(id){
  const data=await fetchAudio(`tts/${id}.m4a`, false), b=await A.ctx.decodeAudioData(data);
  return new Promise(done=>{ const n=A.ctx.createBufferSource(); n.buffer=b; const g=A.ctx.createGain(); g.gain.value=1.4; n.connect(g).connect(A.master); n.onended=done; ttsNode=n; n.start(); });
}
// Read pieces of text one after another; a newer call (or hush) stops an older one.
async function speakAll(segs){
  hush(); const run=++ttsRun; await ttsReady();
  for(const {who,text} of segs){
    if(run!==ttsRun || !text) continue;
    const id=ttsId(who,text);
    if(TTS_SET.has(id) && A.ctx){ try{ if(A.ctx.state!=='running') await A.ctx.resume(); await speakRecorded(id); continue; }catch(e){} }
    if(run===ttsRun) await speakDevice(who, text);
  }
}
const speak = (id, text) => speakAll([{who:id, text}]);
const hush = () => { ttsRun++; if(TTS) speechSynthesis.cancel(); if(ttsNode){ try{ ttsNode.stop(); }catch(e){} ttsNode=null; } };
const textOf = el => el ? el.innerText.replace(/\s+/g,' ').trim() : '';
// What this screen reads, in pieces (so shared lines like hints only need one recording), and who reads it.
function readable(){
  const say=app.querySelector('.say'), who=say?.querySelector('[data-m]')?.dataset.m || 'sona', seg=els=>[...els].map(e=>({who, text:textOf(e)})).filter(x=>x.text);
  if(UI.screen==='lesson'){
    const sh=app.querySelector('.sheet');
    if(sh) return seg(sh.querySelectorAll('h3, h3 ~ p:not(.tip)'));
    return seg(say?.querySelectorAll('.bubble .bt, .bubble > p')||[]);
  }
  if(UI.screen==='learn') return seg(app.querySelectorAll('article.slide > h2, article.slide > p'));
  return seg(say?.querySelectorAll('.bubble .bt, .bubble > p')||[]);
}
// After each render: read new text automatically (re-renders of the same text stay quiet).
function autoRead(){
  if(!S.readAloud || !['lesson','learn'].includes(UI.screen)) return;
  const r=readable(), key=UI.screen+'|'+r.map(x=>x.text).join('|'); if(!r.length || key===ttsKey) return;
  ttsKey=key; speakAll(r);
}
// The replay button that sits in each character's speech bubble.

  if(!S.readAloud) return;
  for(const b of app.querySelectorAll('.say .bubble')){ if(b.querySelector('.readbtn')) continue;
    b.append(frag(`<button class="iconbtn readbtn" data-act="readAloud" aria-label="Read this to me">${I.speak}</button>`)); }
}

function startSoundcheck(){
  const song=songById('rcc'), off=at(song,60), n=Math.floor(8*song.bar*A.ctx.sampleRate), chs=[...song.mix,'mc'], raw={}, ideal={}, gain={};
  // The loudest peak in the loop: the meter holds peaks for one full loop, like listening through a whole chorus.
  const peakOf=(b,o)=>{ let pk=0; const s0=Math.floor(o*b.sampleRate); for(let ch=0;ch<b.numberOfChannels;ch++){ const d=b.getChannelData(ch); for(let i=s0;i<s0+n&&i<d.length;i++) pk=Math.max(pk,Math.abs(d[i])); } return 20*Math.log10(pk+1e-9); };
  for(const k of chs){
    raw[k] = k==='mc' ? peakOf(A.buf['speech:'+song.speaker.voice],0)-18 : peakOf(A.buf[`rcc:${k}`],off);   // the MC's lav is recorded quietly
    ideal[k]=-11-raw[k]; gain[k]=Math.round(ideal[k]+(coin()?1:-1)*(8+Math.random()*12));
  }
  UI = { screen:'sc', sc:{ chs, raw, ideal, gain, hist:{}, result:null } };
}
function scPlay(){
  stopAll(); stopMixer(); const c=A.ctx, song=songById('rcc'), sc=UI.sc, off=at(song,60), dur=8*song.bar, t0=c.currentTime+0.05;
  const bus=c.createGain(); bus.connect(A.master); sc.nodes={}; sc.srcs=[]; sc.bus=bus;
  for(const k of sc.chs){
    const isMc=k==='mc', b=isMc?A.buf['speech:'+song.speaker.voice]:A.buf[`rcc:${k}`], n=c.createBufferSource(); n.buffer=b; n.loop=true;
    n.loopStart=isMc?0:off; n.loopEnd=isMc?Math.min(8,b.duration):off+dur;
    const pre=c.createGain(); pre.gain.value=isMc?db(-18):1; n.connect(pre);
    const an=c.createAnalyser(); an.fftSize=4096; pre.connect(an);   // ~85 ms windows, read every 50 ms: no transient slips between
    // Turning the gain changes the meter (and clipping), not the listening level.
    const listen = isMc ? A.speechDb[song.speaker.voice]+18-4 : song.trim+song.ref[k];
    const g=c.createGain(); g.gain.value=db(sc.gain[k]); const clip=c.createWaveShaper(); clip.curve=new Float32Array([-1,1]);
    const post=c.createGain(); post.gain.value=db(listen-sc.gain[k]); pre.connect(g).connect(clip).connect(post).connect(bus);
    n.start(t0, isMc?0:off); sc.srcs.push(n); sc.nodes[k]={an,g,post,listen};
  }
  sc.playing=true; sc.loopMs=(isFinite(dur)?dur:15)*1000+300; scMeterLoop();
}
function scStop(){ const sc=UI.sc; if(!sc||!sc.srcs) return; sc.srcs.forEach(s=>{ try{s.stop();}catch(e){} }); if(sc.bus){ const b=sc.bus; b.gain.setTargetAtTime(0,A.ctx.currentTime,0.01); setTimeout(()=>b.disconnect(),150); } sc.srcs=[]; sc.playing=false; }
function scMeterLoop(){
  const sc=UI.sc, buf=new Float32Array(4096);
  clearInterval(sc.timer);
  const tick=()=>{ if(UI.screen!=='sc' || !sc.playing){ clearInterval(sc.timer); return; }
    for(const k of sc.chs){ const nd=sc.nodes[k]; if(!nd) continue; nd.an.getFloatTimeDomainData(buf); let pk=0; for(const x of buf) pk=Math.max(pk,Math.abs(x));
      const d=20*Math.log10(pk*db(sc.gain[k])+1e-9), h=(sc.hist[k]=(sc.hist[k]||[]).filter(x=>performance.now()-x[0]<sc.loopMs)); h.push([performance.now(),d]);
      const hold=Math.max(...h.map(x=>x[1])), bar=document.getElementById('scm-'+k), t=document.getElementById('sct-'+k);
      if(bar){ bar.style.width=Math.max(0,Math.min(100,(d+60)/66*100))+'%'; bar.className = d>0?'clip':d>-6?'hot':d>-18?'good':'low'; }
      if(t) t.textContent = hold<-80 ? '—' : `${hold>0?'+':''}${hold.toFixed(0)} dBFS`; } };
  sc.timer=setInterval(tick, 50);   // keeps measuring even if the screen isn't redrawing
}
function finishSoundcheck(){
  const sc=UI.sc, song=songById('rcc'), notes=[]; let ok=0;
  for(const k of sc.chs){ const h=sc.hist[k]||[], hold=h.length?Math.max(...h.map(x=>x[1])):-99, good=hold>=GAIN_ZONE[0]-2 && hold<=GAIN_ZONE[1]+1; if(good) ok++;
    notes.push({k, good, bad:!good, msg: good?`Healthy (${hold.toFixed(0)} dBFS)` : hold>GAIN_ZONE[1]+1 ? `Too hot (${hold>0?'+':''}${hold.toFixed(0)} dBFS): turn the gain down` : `Too low (${hold.toFixed(0)} dBFS): turn the gain up`}); }
  scStop(); const score=Math.round(100*ok/sc.chs.length); sc.result={score, notes:notes.sort((a,b)=>b.bad-a.bad)};
  if(score>=70){ S.done['run-1']=Math.max(S.done['run-1']||0, score); S.xp+=Math.round(score/2); bumpStreak(); save(); }
  render();
}

// Make sure audio (and optionally a specific song) is loaded, showing a loader if we have to wait.
async function withAudio(fn, songId){
  const song = songId && songById(songId);
  const needsLoad = !A.buf.pink || (song && !song.ready);
  if(needsLoad){ UI.loading=true; render(); }
  try{ await initAudio(); if(song) await loadSong(song, true); }
  catch(e){
    console.error(e); UI.loading=false; render();
    alert(location.protocol==='file:' ? 'Sound School needs to be opened from the website (or a local web server) so it can load the band\'s tracks.' : 'Sorry, the band\'s tracks couldn\'t be loaded. Check your connection and try again.');
    return false;
  }
  if(A.ctx.state!=='running') A.ctx.resume();
  UI.loading=false;
  if(fn){ fn(); render(); } else if(needsLoad) render();
  return true;
}
function startLesson(unitId, level){
  FOUND = FOUND_ALL.map(b=>b.slice());
  UI = { screen:'lesson', lesson:{ unit:unitId, level, n:unitId==='found'?6:8, i:0, qs:[], picked:null, correct:0, seed:Math.floor(Math.random()*SONGS.length) } };
}
function startPractice(){
  const pool=[]; UNITS.forEach(u=>{ if(GEN[u.id]) [1,2,3].forEach(l=>{ if(passed(u,l)) pool.push([u.id,l]); }); });
  FOUND = FOUND_ALL.map(b=>b.slice());
  UI = { screen:'lesson', lesson:{ practice:true, pool, n:8, i:0, qs:[], picked:null, correct:0, seed:Math.floor(Math.random()*SONGS.length) } };
}

}
async function openExercise(id){
  const x=exById(id); stopAll(); stopMixer(); markPlaying(null);
  if(x.mixer){ if(!(await withAudio())) return; const song=pick(readySongs());
    await withAudio(()=>{ startMixer(1, song.id, 'house'); const chs=shuffle(missionCh(song,1).filter(k=>!FX.includes(k)&&!song.traps.includes(k))).slice(0, coin()?1:2);
      UI.mix.quick=true; UI.mix.build=false; UI.mix.probs=Object.fromEntries(chs.map(k=>[k, pick(TONE_PROBS)])); }, song.id); }
  else if(x.needs==='gate'){ if(!(await withAudio(null,'lhc'))) return; if(!LOW_MEM) await withAudio(null,'isg'); A.gateOk=await ensureGate(); prepGateFix(); startExercise(id); render(); }
  else if(x.guide){ if(!(await withAudio(null, EQG.song))) return; UI.loading=true; render(); await prepEqGuide(); UI.loading=false; startExercise(id); render(); }

function startPlacement(){
  FOUND = FOUND_ALL.map(b=>b.slice());
  UI = { screen:'lesson', lesson:{ placement:true, plan:PLACEMENT, n:PLACEMENT.length, i:0, qs:[], picked:null, correct:0, seed:Math.floor(Math.random()*SONGS.length) } };
}
// Areas you get fully right count as "tested out": their Learn and Easy levels are marked done
// (and Medium too for Mixing, which was checked at Medium and Hard).
function finishPlacement(){
  const L=UI.lesson, by={};
  L.qs.forEach(q=>{ (by[q.unit]=by[q.unit]||[]).push(!!q.right); });
  const tested=[], start=[];
  for(const id of Object.keys(by)){
    const u=unitById(id);
    if(by[id].every(x=>x)){ tested.push(id); [0,1].concat(id==='mix'?[2]:[]).forEach(l=>{ S.done[key(u,l)] = S.done[key(u,l)] || 'placed'; }); }
    else start.push(id);
  }
  const frac=L.correct/L.n, lvl=PLACE_LEVELS.filter(x=>frac>=x[0]).pop();
  if(frac>=0.9) S.unlockAll=true;
  S.placement={ when:dayKey(0), correct:L.correct, total:L.n, level:lvl[1], start };
  const xp=L.correct*5; S.xp+=xp; bumpStreak(); save();
  UI = { screen:'result', result:{ placement:true, correct:L.correct, total:L.n, xp, level:lvl, tested, start } };
}
function finishLesson(){
  if(UI.lesson.placement) return finishPlacement();
  if(UI.lesson.exercise){
    const L=UI.lesson, xp=L.correct*8; S.ex=S.ex||{}; S.ex[L.exercise]=Math.max(S.ex[L.exercise]||0, L.correct);
    S.xp+=xp; bumpStreak(); save();
    UI = { screen:'result', result:{ exercise:L.exercise, correct:L.correct, total:L.n, xp } }; return;
  }
  const L=UI.lesson, total=L.n, pass=L.correct>=Math.ceil(total*0.75);
  const xp=L.correct*10 + (L.correct===total?20:0);
  if(!L.practice && pass){ const k=`${L.unit}-${L.level}`; S.done[k]=Math.max(S.done[k]||0, L.correct); }
  S.xp+=xp; bumpStreak(); save();
  UI = { screen:'result', result:{ unit:L.practice?L.qs[0].unit:L.unit, level:L.level, correct:L.correct, total, xp, pass, practice:!!L.practice } };
}
function clipSpec(k){
  if(k==='test') return {src:PINK(SONGS[0])};
  if(UI.screen==='learn') return unitById(UI.unit).learn[UI.slide].demos[+k.slice(1)].spec();
  if(UI.screen==='eqguide'){ if(k==='gbf'||k==='gbe') return eqBandSpec(k==='gbe'); const m=k.match(/^g(\d+)([femn])$/), it=EQ_START[+m[1]];
    return m[2]==='m' ? eqBandOne(it,'flat') : m[2]==='n' ? eqBandOne(it,'on') : eqgSpec(it, m[2]==='e'); }
  const q=lessonQ(UI.lesson);
  return (k[0]==='a'?q.after:k[0]==='r'?q.refs:q.clips)[+k.slice(1)].spec;
}
function markPlaying(k, secs){
  playingKey=k;
  document.querySelectorAll('.clip').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  clearTimeout(playTimer);
  if(k) playTimer=setTimeout(()=>{ if(secs>=60) stopAll(); playingKey=null; document.querySelectorAll('.clip.on').forEach(b=>b.classList.remove('on')); }, secs*1000);   // loops stop when the button does
}
function go(ui){ hush(); ttsKey=''; stopAll(); stopMixer(); if(ui.screen!=='console') conStop(); markPlaying(null); UI=ui; render(); window.scrollTo(0,0); }
async function openLevel(id, l){
  if(l===0) return go({screen:'learn', unit:id, slide:0});
  stopAll(); stopMixer(); markPlaying(null);
  if(id==='run'){
    if(!(await withAudio())) return;
    if(l===1) await withAudio(()=>startSoundcheck(), 'rcc');
    else await withAudio(()=>startMixer(l===2?4:5, 'rcc', 'house', 'run', l), 'rcc');
    window.scrollTo(0,0); return;
  }
  if(id==='final' || id==='bcast'){
    // Alternate songs each time a mission opens. The livestream mix uses the songs with crowd mics.
    const dest = id==='bcast' ? 'broadcast' : 'house';
    S.mixTurn=(S.mixTurn||0)+1; save();
    if(!(await withAudio())) return;
    const songs=mixSongs(dest), song=songs[S.mixTurn%songs.length];
    await withAudio(()=>startMixer(l, song.id, dest), song.id);
  } else if(id==='gate' || id==='comp'){ if(!(await withAudio(null,'lhc'))) return; if(!LOW_MEM) await withAudio(null,'isg'); A.gateOk=await ensureGate(); prepGateFix(); startLesson(id,l); render(); }
  else if(id==='eq'){ if(!(await withAudio(null, EQG.song))) return; UI.loading=true; render(); await prepEqGuide(); UI.loading=false; startLesson(id,l); render(); }
  else await withAudio(()=>startLesson(id,l), id==='ours'?'rcc':undefined);
  window.scrollTo(0,0);
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='signinEmail'){ e.preventDefault(); document.querySelector('[data-act=signEmail]')?.click(); } });
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act=el.dataset.act;
  switch(act){
    case 'play': {
      const k=el.dataset.k;
      if(playingKey===k){ stopAll(); markPlaying(null); return; }
      if(!(await withAudio(null, UI.screen==='learn'&&UI.unit==='ours'?'rcc':undefined))) return;
      markPlaying(k, play(clipSpec(k)));
      if(UI.screen==='lesson'){ const q=lessonQ(UI.lesson); if(q.tool==='gainset') gainMeterLoop(q); if(q.tool==='gatefix'||q.tool==='compfix') dynToolLoop(q); }
      break; }
    case 'home': go({screen:'home'}); break;
    case 'eqGuide': { const back=el.dataset.back; if(back==='learn'){ const ret={unit:UI.unit, slide:UI.slide}; await openEqGuide('eqBack'); UI.ret=ret; } else await openEqGuide(UI.screen==='exIntro'?'home':'home'); break; }
    case 'eqBack': go({screen:'learn', ...(UI.ret||{unit:'eq',slide:0})}); break;
    case 'signGoogle': {
      const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      fb.auth.signInWithPopup(p).catch(err=>{ if(err.code==='auth/popup-blocked'||err.code==='auth/operation-not-supported-in-this-environment') return fb.auth.signInWithRedirect(p);
        if(err.code!=='auth/popup-closed-by-user'&&err.code!=='auth/cancelled-popup-request'){ ME.msg='Google sign-in didn\'t finish. Try again, or use the email link.'; render(); } });
      break; }
    case 'signEmail': {
      const email=(document.getElementById('signinEmail')||{}).value?.trim();
      if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ ME.msg='Type your email address first.'; render(); break; }
      el.disabled=true;
      fb.auth.sendSignInLinkToEmail(email, {url:location.origin+location.pathname, handleCodeInApp:true})
        .then(()=>{ localStorage.setItem('ss-signin-email', email); ME.msg=null; UI.sent=email; render(); })
        .catch(()=>{ ME.msg='We couldn\'t send the link. Check the address and try again.'; render(); });
      break; }
    case 'signAgain': UI.sent=null; render(); break;
    case 'signOut': clearTimeout(pushT); fb.auth.signOut(); break;
    case 'checkApproval': { const u=ME.user; if(!u) break; try{ const a=await fb.db.doc('approvals/'+u.uid).get(); ME.approved=!!(a.exists&&a.data().approved); }catch(e){}
      if(ME.approved){ UI=startUI(); render(); } else alert('Not yet. Ask a sound team leader to approve you, then try again.'); break; }
    case 'team': go({screen:'team'}); loadTeam(); break;
    case 'teamApprove': case 'teamRevoke': {
      const uid=el.dataset.uid, yes=act==='teamApprove', person=(UI.team||[]).find(p=>p.uid===uid);
      if(!yes && !confirm('Remove this person\'s access to Sound School?')) break;
      el.disabled=true;
      const jobs=[fb.db.doc('approvals/'+uid).set({approved:yes, by:ME.user.email, at:firebase.firestore.FieldValue.serverTimestamp()})];
      if(!yes && person && person.email) jobs.push(fb.db.doc('invites/'+person.email).delete());   // so they can't re-approve themselves
      Promise.all(jobs).then(loadTeam).catch(()=>{ alert('That didn\'t save. Try again.'); el.disabled=false; });
      break; }
    case 'invite': {
      const raw=(document.getElementById('inviteBox')||{}).value||'', emails=[...new Set(raw.split(/[\s,;]+/).map(e=>e.trim().toLowerCase()).filter(e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)))];
      if(!emails.length){ alert('Type at least one email address.'); break; }
      el.disabled=true; const b=fb.db.batch();
      emails.forEach(e=>b.set(fb.db.doc('invites/'+e), {approved:true, by:ME.user.email, at:firebase.firestore.FieldValue.serverTimestamp()}));
      b.commit().then(()=>{ alert(`Added ${emails.length} ${emails.length===1?'person':'people'}. They can sign in now.`); loadTeam(); }).catch(()=>{ alert('That didn\'t save. Try again.'); el.disabled=false; });
      break; }
    case 'uninvite': if(confirm(`Remove ${el.dataset.email} from the approved list?`)) fb.db.doc('invites/'+el.dataset.email).delete().then(loadTeam); break;
    case 'settings': go({screen:'settings'}); break;
    case 'begin': S.setup=true; save(); go(sharedEx ? {screen:'exIntro', ex:sharedEx} : {screen:'place'}); break;
    case 'exStart': openExercise(el.dataset.ex); break;

      if(navigator.clipboard) navigator.clipboard.writeText(link).then(done, ()=>alert('Here\'s the link to share:\n'+link)); else alert('Here\'s the link to share:\n'+link);

    case 'open': if(el.dataset.l==='sp'){ await openEqGuide('home'); UI.sp=true; render(); } else openLevel(el.dataset.u, +el.dataset.l); break;

    case 'learnDone': {
      const u=unitById(UI.unit), k=key(u,0);
      if(!S.done[k]){ S.done[k]=1; S.xp+=10; bumpStreak(); save(); }
      openLevel(u.id, 1);
      break; }
    case 'gainLock': {
      const L=UI.lesson, q=lessonQ(L); if(L.picked!=null) return;
      if(!q.state.played){ alert('Press Play first so you can see the meter.'); return; }
      const {ok, why}=gainGrade(q); L.picked=ok?0:1; q.right=ok; if(ok) L.correct++; q.explain=why;
      stopAll(); markPlaying(null); render(); break; }
    case 'gainCur': { const q=lessonQ(UI.lesson), st=q.state; st.cur=+el.dataset.i;
      st.chs.forEach((ch,i)=>{ if(ch.solo) ch.solo.gain.setTargetAtTime(i===st.cur?1:0, A.ctx.currentTime, 0.02);
        const bt=document.querySelector(`[data-act="gainCur"][data-i="${i}"]`); if(bt){ bt.setAttribute('aria-pressed', i===st.cur); bt.textContent = i===st.cur?'Listening':'Listen'; } }); break; }
    case 'fitMute': { const q=lessonQ(UI.lesson), st=q.state; st.mute=!st.mute; if(st.node) st.node.gain.setTargetAtTime(st.mute?0:db(chDb(songById(q.song),q.k,st.v-st.target)), A.ctx.currentTime, 0.02);
      el.setAttribute('aria-pressed', st.mute); el.textContent = st.mute?'Muted':'Mute it'; break; }
    case 'fitLock': { const L=UI.lesson, q=lessonQ(L); if(L.picked!=null) return;
      const {ok, why}=fitGrade(q); L.picked=ok?0:1; q.right=ok; if(ok) L.correct++; q.explain=why; stopAll(); markPlaying(null); render(); break; }
    case 'walkStart': { const q=lessonQ(UI.lesson); if(!(await withAudio())) return; runWalkup(q); render(); break; }
    case 'walkMic': { const q=lessonQ(UI.lesson), st=q.state; if(!st.running||st.mic!=null) return;
      st.mic=A.ctx.currentTime-st.t0; st.mic_g.gain.setTargetAtTime(1, A.ctx.currentTime, 0.05); el.disabled=true; break; }
    case 'walkBand': { const q=lessonQ(UI.lesson), st=q.state; if(!st.running||st.band!=null) return;
      st.band=A.ctx.currentTime-st.t0; st.bandBus.gain.setTargetAtTime(db(-15), A.ctx.currentTime, 0.4); el.disabled=true; break; }
    case 'stepPick': {
      const L=UI.lesson, q=lessonQ(L); if(L.picked!=null) return; const st=q.scen.steps[q.step], i=+el.dataset.i;
      if(i===0){ q.step++; q.last=null; } else { q.misses++; q.last=st.why; }
      if(q.step>=q.scen.steps.length){ const ok=q.misses<=1; L.picked=ok?0:1; q.right=ok; if(ok) L.correct++;
        q.explain = ok ? `Nice and systematic${q.misses?' (one wrong turn)':''}: stay calm, check the basics, assume the simplest failure, then isolate the chain.` : `You got there with ${q.misses} wrong turns. The order matters: attitude, basics, the smallest likely failure, then isolate one part at a time.`; }
      render(); break; }
    case 'dynLock': {
      const L=UI.lesson, q=lessonQ(L); if(L.picked!=null) return;
      const {ok, why} = q.tool==='gatefix' ? gateExplain(q) : compExplain(q); L.picked=ok?0:1; q.right=ok; if(ok) L.correct++; q.explain=why;
      stopAll(); markPlaying(null); render(); break; }
    case 'buildCheck': {
      const m=UI.mix, steps=buildSteps(mixSong(), m.level), r=buildCheck(); m.buildRes=r;
      if(r.ok){ m.buildStep++; m.buildRes = m.buildStep<steps.length ? {notes:[{k:steps[m.buildStep-1].ch[0], good:true, msg:`Step ${m.buildStep} done. Now: ${steps[m.buildStep].title}.`}]} : r; }
      render(); break; }
    case 'mixSolo': { const q=lessonQ(UI.lesson); q.state.solo=!q.state.solo; if(q.state.others) q.state.others.gain.setTargetAtTime(q.state.solo?0:1, A.ctx.currentTime, 0.02);
      el.setAttribute('aria-pressed', q.state.solo); el.textContent = q.state.solo ? `Soloed: ${q.it.name}` : `Solo the ${q.it.name.toLowerCase()}`; break; }
    case 'fixBypass': { const q=lessonQ(UI.lesson); q.state.bypass=!q.state.bypass; fixApply(q); el.setAttribute('aria-pressed',q.state.bypass); el.textContent=q.state.bypass?'EQ is off':'EQ off'; break; }
    case 'fixReset': { const q=lessonQ(UI.lesson); Object.assign(q.state.eq,{hp:0,lo:0,mg:0,mf:1000,hi:0}); q.state.bypass=false; fixApply(q); const keep=playingKey; render(); if(keep) markPlaying(keep, 9999); break; }
    case 'fixLock': {
      const L=UI.lesson, q=lessonQ(L); if(L.picked!=null) return;
      const {ok, why}=q.tool==='eqmix' ? eqmixGrade(q) : fixGrade(q); L.picked = ok?0:1; q.right=ok; if(ok) L.correct++; q.explain=why;
      stopAll(); markPlaying(null); render(); break; }
    case 'ringLock': {
      const L=UI.lesson, q=lessonQ(L); if(L.picked!=null) return;
      const oct=Math.abs(Math.log2(q.state.f/q.ring)), ok=oct<=1/3;
      L.picked = ok ? 0 : 1; q.right=ok; if(ok) L.correct++;
      q.explain = ok ? `You found it: the ring was near ${hz(Math.round(q.ring/10)*10)} and your cut was at ${hz(Math.round(q.state.f/10)*10)}. Put a narrow cut (a high Q) of just a few dB on the main L/R EQ, not on each person's channel. And ask why it rang: is a mic in front of the speakers or near a wedge?`
                     : `The ring was near ${hz(Math.round(q.ring/10)*10)}, but your cut was at ${hz(Math.round(q.state.f/10)*10)}. Tip: sweep slowly and listen for the moment the ringing suddenly disappears.`;
      stopAll(); markPlaying(null); render(); break; }
    case 'answer': {
      const L=UI.lesson; if(L.picked!=null) return;
      L.picked=+el.dataset.i; const q=lessonQ(L); q.right = L.picked===q.answer; if(q.right) L.correct++;
      render(); break; }
    case 'next': {
      const L=UI.lesson; L.i++; L.picked=null;
      if(L.i>=L.n) finishLesson();
      go(UI); break; }
    case 'quit': if(confirm('Quit this lesson? Your answers so far won\'t be saved.')) go({screen:'home'}); break;
    case 'unlock': S.unlockAll=!S.unlockAll; save(); render(); break;
    case 'readToggle': S.readAloud=!S.readAloud; save(); if(!S.readAloud) hush(); else speak('sona','Hi! I\'ll read the lessons to you. Each of us has our own voice.'); render(); break;
    case 'readAloud': { if((TTS && speechSynthesis.speaking) || ttsNode){ hush(); break; } if(!(await withAudio())) break; speakAll(readable()); break; }
    case 'hello': { const m=el.dataset.m, u=UNITS.find(x=>x.mascot===m); speak(m, `Hi, I'm ${u.who.split(',')[0]}. ${u.id==='found'?'I\'m your guide.':`I teach ${u.title}.`}`); break; }
    case 'reset': if(confirm('Reset all your Sound School progress on this device?')){ Object.assign(S,{xp:0,streak:0,lastDay:null,done:{},placement:null}); save(); render(); } break;
    case 'resetRefs': if(confirm('Go back to the built-in reference mixes?')){ S.refs={}; save(); applySavedRefs(); render(); } break;
    /* mixer */
    case 'mixSong': {
      const id=el.dataset.s; if(id===UI.mix.song) return;
      const was=MX.playing; stopMixer(); const lv=UI.mix.level, dest=UI.mix.dest; await withAudio(()=>startMixer(lv, id, dest), id);
      if(was && UI.screen==='mixer' && UI.mix.song===id && !UI.mix.run){ startMixerPlayback(); render(); }   // keep the music going on the new song
      break; }
    case 'scPlay': if(UI.sc.playing){ scStop(); } else scPlay(); render(); break;
    case 'scDone': finishSoundcheck(); break;
    case 'scAgain': scStop(); startSoundcheck(); render(); break;
    case 'scQuit': scStop(); go({screen:'home'}); break;
    case 'runStart': UI.mix.result=null; startMixerPlayback(); render(); break;
    case 'runStop': stopMixer(); UI.mix.runLog=[]; render(); break;
    case 'mixPlay': if(MX.playing) stopMixer(); else startMixerPlayback(); render(); break;
    /* console */
    case 'openConsole': openConsole(); break;
    case 'conQuit': conStop(); go({screen:'home'}); break;
    case 'conPlay': if(CON.playing) conStop(); else conStart(); conRender(); break;
    case 'conSel': UI.con.sel=el.dataset.k; conRender(); break;
    case 'conTab': UI.con.tab=el.dataset.t; conRender(); break;
    case 'conTop': document.getElementById('cbank')?.scrollIntoView({behavior:'smooth', block:'center'}); break;
    case 'conOpen': UI.con.sel=el.dataset.k; UI.con.tab=el.dataset.t; UI.con.layer='in'; conRender(); document.getElementById('con-detail')?.scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'conMute': { const s=UI.con.ch[el.dataset.k]; s.mute=!s.mute; conApply(); conRender(); break; }
    case 'conSolo': { const s=UI.con.ch[el.dataset.k]; s.solo=!s.solo; conApply(); conRender(); break; }
    case 'conToggle': { const s=UI.con.ch[el.dataset.k], [a,b]=el.dataset.p.split('.'); s[a][b]=!s[a][b]; conApply(el.dataset.k); conRender(); break; }
    case 'conEqFlat': { const s=UI.con.ch[el.dataset.k], f=conStrip(0); Object.assign(s,{eq:f.eq, hp:0, hpOn:false, hpF:80, eqOn:true}); conApply(el.dataset.k); conRender(); break; }
    case 'conDynOn': { const s=UI.con.ch[el.dataset.k], which=el.closest('.mpanel').querySelector('.mtag').textContent==='GATE'?'gate':'comp'; s[which].on=!s[which].on; conApply(el.dataset.k); conRender(); break; }
    case 'conDesOn': { const s=UI.con.ch[el.dataset.k]; s.des.on=!s.des.on; conApply(el.dataset.k); conRender(); break; }
    case 'conMainOn': { const M=UI.con.master; M[el.dataset.k]=!M[el.dataset.k]; conApply(); conRender(); break; }
    case 'conRevType': UI.con.fx.revType=el.dataset.t; conApply(); conRender(); break;
    case 'conDlyFac': UI.con.fx[el.dataset.side]=+el.dataset.v; conApply(); conRender(); break;
    case 'conDlyPreset': { const x=CON_DLY[el.dataset.t]; Object.assign(UI.con.fx,{facL:x.l, facR:x.r}); conApply(); conRender(); break; }
    case 'conDlySync': UI.con.fx.dlyMs=Math.round(conSong().beat*1000); conApply(); conRender(); break;
    case 'conTap': {   // tap tempo: the average of the last few taps
      const now=performance.now(), T=(A.taps=(A.taps||[]).filter(t=>now-t<2500)); T.push(now);
      if(T.length>=2){ const d=(T[T.length-1]-T[0])/(T.length-1); if(d>=50&&d<=2000){ UI.con.fx.dlyMs=Math.round(d); conApply(); dlyReadout(); const kn=document.querySelector('.knob[data-k="_fx"][data-p="dlyMs"]'); if(kn) knobShow(kn, UI.con.fx.dlyMs); const sb=document.querySelector('[data-act=conDlySync]'); if(sb) sb.classList.toggle('on', Math.abs(UI.con.fx.dlyMs-Math.round(conSong().beat*1000))<=1); } }
      el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),90); break; }
    case 'conFxJump': document.getElementById(el.dataset.to||'con-fx')?.scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'conLayer': UI.con.layer=el.dataset.l; conRender(); break;
    case 'conBtn': { const s=UI.con.ch[el.dataset.k]; s[el.dataset.p]=!s[el.dataset.p]; conApply(el.dataset.k); conRender(); break; }
    case 'conEqOn': { const s=UI.con.ch[el.dataset.k]; s.eqOn=!s.eqOn; conApply(el.dataset.k); conRender(); break; }
    case 'conHpOn': { const s=UI.con.ch[el.dataset.k]; s.hpOn=!s.hpOn; s.hp=s.hpOn?s.hpF:0; conApply(el.dataset.k); conRender(); break; }
    case 'conSec': { UI.con.sec=+el.dataset.i; if(CON.playing){ conStop(); conStart(); } conRender(); break; }
    case 'conMasterT': { const M=UI.con.master; M[el.dataset.p]=!M[el.dataset.p]; conApply(); conRender(); break; }
    case 'conCheck': UI.con.result=conScore(); conRender(); setTimeout(()=>document.querySelector('.notes')?.scrollIntoView({behavior:'smooth',block:'center'}),50); break;
    case 'mixSec': { const m=UI.mix, was=MX.playing; m.sec = el.dataset.i==='' ? null : +el.dataset.i; if(was){ stopMixer(); startMixerPlayback(); } render(); break; }
    case 'mute': {
      const k=el.dataset.k, m=UI.mix; m.mute[k]=!m.mute[k]; updateGains();
      el.setAttribute('aria-pressed', m.mute[k]);
      const row=el.closest('.ch'); row.querySelector('.dbv').textContent = m.mute[k]?'Muted':fmtDb(m.g[k]);
      row.classList.toggle('off', m.mute[k] || m.g[k]<=FADER_MIN);
      break; }
    case 'mixSubmit': UI.mix.ref=false; UI.mix.result=scoreMix(); updateGains(); render(); break;
    case 'mixRef': UI.mix.ref=!UI.mix.ref; updateGains(); render(); break;
    case 'mixPhone': UI.mix.phone=!UI.mix.phone; if(MX.full){ MX.full.gain.setTargetAtTime(UI.mix.phone?0:1, A.ctx.currentTime, 0.02); MX.phoneOut.gain.setTargetAtTime(UI.mix.phone?1:0, A.ctx.currentTime, 0.02); } render(); break;
    case 'eqToggle': UI.mix.eqOpen = UI.mix.eqOpen===el.dataset.k ? null : el.dataset.k; render(); break;
    case 'eqFlat': UI.mix.eq[el.dataset.k]={...EQ_FLAT}; updateGains(); render(); break;
    case 'mixStyle': S.mixStyle=el.dataset.v; save(); UI.mix.ref=false; UI.mix.result=null; updateGains(); render(); break;
    case 'saveRef': saveReference(); if(UI.mix.result) UI.mix.result=scoreMix(); render(); break;
    case 'mixFinish': {
      const m=UI.mix, r=m.result, pass=r.score>=70, xp=pass?Math.round(r.score/2):0;
      if(pass){ const k=`${m.unit}-${m.unitLevel??m.level}`; S.done[k]=Math.max(S.done[k]||0, r.score); }
      S.xp+=xp; bumpStreak(); save();
      if(pass) go({ screen:'result', result:{ unit:m.unit, level:m.unitLevel??m.level, correct:r.score, total:100, xp, pass, mix:true } });
      else go({screen:'home'});
      break; }
    case 'quitMix': if(!UI.mix.result || confirm('Leave the mixer? This mix won\'t be saved.')) go({screen:'home'}); break;
  }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.act==='vol'){ S.vol=+t.value; save(); if(A.master) A.master.gain.value=S.vol; }
  if(t.dataset.act==='gainKnob'){
    const q=lessonQ(UI.lesson), i=+t.dataset.i||0, ch=q.state.chs[i]; ch.gainDb=+t.value; if(ch.node) ch.node.gain.setTargetAtTime(db(ch.gainDb), A.ctx.currentTime, 0.02);
    const lb=document.getElementById('gainlbl-'+i); if(lb) lb.textContent=`${ch.gainDb>0?'+':''}${ch.gainDb} dB`;
  }
  if(t.dataset.act==='fitFader'){
    const q=lessonQ(UI.lesson), st=q.state; st.v=+t.value; if(st.node && !st.mute) st.node.gain.setTargetAtTime(db(chDb(songById(q.song),q.k,st.v-st.target)), A.ctx.currentTime, 0.02);
    const lb=document.getElementById('fitlbl'); if(lb) lb.textContent=`${st.v>0?'+':''}${st.v} dB`;
  }
  if(t.dataset.act==='console'){ S.console=t.value; save(); }
  if(t.dataset.act==='fixParam'){
    const q=lessonQ(UI.lesson), e=q.state.eq, pp=t.dataset.p, v=+t.value;
    if(pp==='hp') e.hp=FIX_HPF[v]; else if(pp==='mf') e.mf=Math.round(100*Math.pow(80,v/1000)); else e[pp]=v;
    if(q.state.bypass){ q.state.bypass=false; const b=document.querySelector('[data-act=fixBypass]'); if(b){ b.textContent='EQ off'; b.setAttribute('aria-pressed','false'); } }
    fixApply(q);
    const lb=document.getElementById('fx-'+pp); if(lb) lb.textContent = pp==='hp' ? (e.hp?hz(e.hp):'Off') : pp==='mf' ? hz(Math.round(e.mf/10)*10) : `${e[pp]>0?'+':''}${e[pp].toFixed(1).replace('.0','')} dB`;
    const cv=document.getElementById('fx-curve'); if(cv) cv.replaceChildren(frag(eqCurve(fixUserEq(e))));
  }
  if(t.dataset.act==='conParam'){
    const k=t.dataset.k, s=UI.con.ch[k], p=t.dataset.p, v=+t.value, g=x=>`${x>0?'+':''}${(+x).toFixed(1).replace('.0','')} dB`;
    let txt;
    if(p==='hp'){ s.hp=CON_HPF[v]; txt=s.hp?hz(s.hp):'Off'; }
    else if(p==='eq.lmf'){ s.eq.lmf=logVal(v,60,2000); txt=hz(s.eq.lmf); }
    else if(p==='eq.hmf'){ s.eq.hmf=logVal(v,500,12000); txt=hz(s.eq.hmf); }
    else if(p.includes('.')){ const [a,b]=p.split('.'); s[a][b]=v; txt = /q$/.test(b) ? v.toFixed(1) : b==='ratio' ? v+':1' : /atk|rel/.test(b) ? v+' ms' : /thr/.test(b) ? v+' dB' : g(v); }
    else { s[p]=v; txt = p==='pan' ? '' : fmtS(v); }
    conApply(k);
    const lb=document.getElementById(`cv-${k}-${p.replace(/\./g,'-')}`); if(lb && txt!=='') lb.textContent=txt;
    if((p==='hp'||p.startsWith('eq.')) && UI.con.sel===k){ const cv=document.getElementById('con-curve'); if(cv) cv.replaceChildren(frag(eqCurve(conEqList(s.eq,s.hp)))); }
    UI.con.result=null;
  }
  if(t.dataset.act==='conSong'){ openConsole(t.value, UI.con.start); return; }
  if(t.dataset.act==='conStartSel'){ const was=CON.playing; conStop(); const sec=UI.con.sec, sel=UI.con.sel; UI.con=conInit(UI.con.song, t.value); UI.con.sec=sec; UI.con.sel=sel; if(was) conStart(); conRender(); return; }
  if(t.dataset.act==='conFxSel'){ UI.con.fx[t.dataset.p]=t.value; conApply(); conRender(); return; }
  if(t.dataset.act==='conFx'){ const f=UI.con.fx, p=t.dataset.p; f[p]=+t.value; conApply(); const lb=document.getElementById('cf-'+p); if(lb) lb.textContent = p==='dlyFb' ? Math.round(f[p]*100)+'%' : fmtS(f[p]); }
  if(t.dataset.act==='conMaster'){ UI.con.master.fader=+t.value; conApply(); const lb=document.getElementById('cf-master'); if(lb) lb.textContent=fmtS(+t.value); }
  if(t.dataset.act==='ringFreq'){
    const q=lessonQ(UI.lesson), f=100*Math.pow(80, +t.value/1000); q.state.f=f;
    if(q.state.node) q.state.node.frequency.setTargetAtTime(f, A.ctx.currentTime, 0.02);
    const lb=document.getElementById('ringlbl'); if(lb) lb.textContent=hz(Math.round(f/10)*10);
  }
  if(t.dataset.act==='hpf'){ UI.mix.hpf[t.dataset.k]=+t.value; updateGains(); }
  if(t.dataset.act==='scGain'){
    const k=t.dataset.k, sc=UI.sc, v=+t.value; sc.gain[k]=v; const nd=sc.nodes&&sc.nodes[k];
    if(nd){ nd.g.gain.setTargetAtTime(db(v),A.ctx.currentTime,0.02); nd.post.gain.setTargetAtTime(db(nd.listen-v),A.ctx.currentTime,0.02); }
    const lb=document.getElementById('scg-'+k); if(lb) lb.textContent=`${v>0?'+':''}${v} dB`;
  }
  if(t.dataset.act==='eqParam'){
    const k=t.dataset.k, p=t.dataset.p, e=UI.mix.eq[k];
    if(p==='mf'){ e.mf=Math.round(100*Math.pow(80,+t.value/1000)); } else e[p]=+t.value;
    updateGains(); const lb=document.getElementById(`eq-${k}-${p}`); if(lb) lb.textContent = p==='mf' ? hz(Math.round(e.mf/10)*10) : `${e[p]>0?'+':''}${e[p].toFixed(1).replace('.0','')} dB`;
    document.querySelector(`.eqbtn[data-k="${k}"]`)?.classList.toggle('on', !isFlat(e));
  }
  if(t.dataset.act==='fader'){
    const k=t.dataset.k, m=UI.mix; m.g[k]=+t.value; updateGains();
    const row=t.closest('.ch'); row.querySelector('.dbv').textContent = m.mute[k]?'Muted':fmtDb(m.g[k]);
    row.classList.toggle('off', m.mute[k] || m.g[k]<=FADER_MIN);
  }
});
// During a lesson: number keys pick an answer, Enter continues.
document.addEventListener('keydown', e=>{
  if(UI.screen!=='lesson' || e.target.closest('input,textarea')) return;
  const L=UI.lesson;
  if(L.picked==null && /^[1-9]$/.test(e.key)) document.querySelector(`[data-act="answer"][data-i="${+e.key-1}"]`)?.click();
  else if(L.picked!=null && e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-act="next"]')?.click(); }
});

applySavedRefs();
cloudInit();
render();
</script>
